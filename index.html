<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GUDU RACING V3</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    background:#80c8ed;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

/* MENU */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#303030,#050505 72%);
    color:white;
    text-align:center;
}

.logo{
    font-size:clamp(45px,11vw,100px);
    font-weight:900;
    letter-spacing:7px;
}

.logo span{
    color:#ff3030;
}

.subtitle{
    color:#aaa;
    letter-spacing:3px;
    margin:12px 0 35px;
}

#start{
    border:0;
    padding:17px 50px;
    border-radius:12px;
    background:white;
    color:#111;
    font-size:17px;
    font-weight:bold;
}

/* HUD */

#hud{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    color:white;
}

#top{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    gap:7px;
}

.box{
    padding:9px 12px;
    background:rgba(0,0,0,.55);
    border-radius:11px;
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(8px);
    font-size:12px;
}

#speed{
    font-size:24px;
    font-weight:bold;
}

#speed small{
    font-size:9px;
    color:#aaa;
}

/* CAMERA */

#cameraBtn{
    pointer-events:auto;
    position:absolute;
    top:70px;
    right:15px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.6);
    color:white;
    padding:11px 15px;
    border-radius:10px;
    font-weight:bold;
}

/* NITRO */

#nitroWrap{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:25px;
    width:280px;
}

#nitroTitle{
    text-align:center;
    font-size:10px;
    letter-spacing:3px;
    margin-bottom:5px;
}

#nitroBar{
    height:12px;
    width:100%;
    background:#111;
    border:1px solid #777;
    border-radius:20px;
    overflow:hidden;
}

#nitroFill{
    height:100%;
    width:100%;
    background:#00d9ff;
}

/* STEERING */

#steering{
    display:none;
    position:fixed;
    z-index:50;
    left:20px;
    bottom:25px;
    width:130px;
    height:130px;
    border:11px solid rgba(255,255,255,.8);
    border-radius:50%;
    background:rgba(0,0,0,.3);
    box-shadow:0 8px 25px rgba(0,0,0,.45);
    touch-action:none;
    transition:transform .08s linear;
}

#steering .v{
    position:absolute;
    width:8px;
    height:90px;
    background:white;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

#steering .h{
    position:absolute;
    width:90px;
    height:8px;
    background:white;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

#steerCenter{
    position:absolute;
    width:34px;
    height:34px;
    border-radius:50%;
    background:#111;
    border:5px solid #ddd;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

/* BUTTONS */

#controls{
    display:none;
    position:fixed;
    right:15px;
    bottom:22px;
    z-index:50;
    gap:9px;
    align-items:flex-end;
}

.control{
    width:75px;
    height:75px;
    border:0;
    border-radius:50%;
    color:white;
    font-weight:bold;
    font-size:10px;
    touch-action:none;
    box-shadow:0 7px 18px rgba(0,0,0,.4);
}

#brake{
    background:rgba(210,30,30,.8);
}

#accelerate{
    background:rgba(0,175,75,.85);
}

#nitro{
    width:85px;
    height:85px;
    background:rgba(0,155,220,.85);
}

@media(max-width:800px){

    #steering{
        display:block;
    }

    #controls{
        display:flex;
    }

    #nitroWrap{
        bottom:160px;
        width:180px;
    }
}
</style>
</head>

<body>

<!-- MENU -->

<div id="menu">

    <div class="logo">
        GUDU<span> RACING</span>
    </div>

    <div class="subtitle">
        DRIVE • DRIFT • DOMINATE
    </div>

    <button id="start">
        START RACE
    </button>

</div>


<!-- HUD -->

<div id="hud">

    <div id="top">

        <div class="box">
            LAP <b id="lap">1</b> / 3
        </div>

        <div class="box">
            POS <b id="position">1</b> / 4
        </div>

        <div class="box" id="speed">
            0 <small>KM/H</small>
        </div>

    </div>

    <button id="cameraBtn">
        🎥 COCKPIT
    </button>

    <div id="nitroWrap">

        <div id="nitroTitle">
            NITRO BOOST
        </div>

        <div id="nitroBar">
            <div id="nitroFill"></div>
        </div>

    </div>

</div>


<!-- STEERING -->

<div id="steering">

    <div class="v"></div>
    <div class="h"></div>
    <div id="steerCenter"></div>

</div>


<!-- CONTROLS -->

<div id="controls">

    <button class="control" id="brake">
        BRAKE
    </button>

    <button class="control" id="accelerate">
        ACCEL
    </button>

    <button class="control" id="nitro">
        NITRO
    </button>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================
   SCENE
========================================= */

const scene=new THREE.Scene();

scene.background=
new THREE.Color(0x82c8ed);

scene.fog=
new THREE.Fog(
    0x82c8ed,
    120,
    800
);


/* =========================================
   CAMERA
========================================= */

const camera=
new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .1,
    1500
);


/* =========================================
   RENDERER
========================================= */

const renderer=
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
    renderer.domElement
);


/* =========================================
   LIGHT
========================================= */

const sun=
new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(
    100,
    150,
    70
);

sun.castShadow=true;

scene.add(sun);

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x376b3b,
        1.4
    )
);


/* =========================================
   MATERIAL
========================================= */

function mat(
    color,
    metal=0,
    rough=.5
){

    return new THREE.MeshStandardMaterial({
        color,
        metalness:metal,
        roughness:rough
    });

}


/* =========================================
   GROUND
========================================= */

const ground=
new THREE.Mesh(

    new THREE.PlaneGeometry(
        1800,
        1800
    ),

    mat(
        0x28783d,
        0,
        1
    )

);

ground.rotation.x=-Math.PI/2;

scene.add(ground);


/* =========================================
   ROAD
========================================= */

const ROAD=3000;

const road=
new THREE.Mesh(

    new THREE.PlaneGeometry(
        22,
        ROAD
    ),

    mat(
        0x242424,
        0,
        .95
    )

);

road.rotation.x=-Math.PI/2;

road.position.set(
    0,
    .02,
    -ROAD/2
);

scene.add(road);


/* =========================================
   ROAD LINES
========================================= */

for(
    let z=10;
    z>-ROAD;
    z-=14
){

    const line=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .35,
            .06,
            7
        ),

        mat(0xffffff)
    );

    line.position.set(
        0,
        .08,
        z
    );

    scene.add(line);
}


/* =========================================
   CURBS
========================================= */

for(
    let z=0;
    z>-ROAD;
    z-=7
){

    for(
        const x of [-11.8,11.8]
    ){

        const curb=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.3,
                .35,
                3.5
            ),

            mat(
                Math.floor(-z/7)%2===0
                ?0xffffff
                :0xe01d2d
            )
        );

        curb.position.set(
            x,
            .18,
            z
        );

        scene.add(curb);
    }
}


/* =========================================
   TREES
========================================= */

function tree(x,z){

    const trunk=
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .35,
            .48,
            3,
            8
        ),

        mat(0x704214)
    );

    trunk.position.set(
        x,
        1.5,
        z
    );

    scene.add(trunk);


    const leaves=
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.8,
            10,
            8
        ),

        mat(0x176b35)
    );

    leaves.position.set(
        x,
        3.5,
        z
    );

    scene.add(leaves);
}


for(
    let i=0;
    i<280;
    i++
){

    const side=
        Math.random()<.5?-1:1;

    tree(
        side*(17+Math.random()*45),
        -Math.random()*ROAD
    );

}


/* =========================================
   CAR CREATOR
========================================= */

function createCar(color){

    const car=
    new THREE.Group();


    const paint=
    mat(
        color,
        .8,
        .18
    );


    const black=
    mat(
        0x050505,
        .25,
        .25
    );


    const glass=
    new THREE.MeshStandardMaterial({

        color:0x10283b,

        metalness:.3,

        roughness:.08

    });


    const silver=
    mat(
        0xbfc4c9,
        .9,
        .15
    );


    /* BODY */

    const body=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.5,
            .48,
            4.7
        ),

        paint
    );

    body.position.y=.67;

    car.add(body);


    /* FRONT */

    const nose=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.25,
            .28,
            1.35
        ),

        paint
    );

    nose.position.set(
        0,
        .82,
        -1.7
    );

    car.add(nose);


    /* CABIN */

    const cabin=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.72,
            .62,
            1.9
        ),

        paint
    );

    cabin.position.set(
        0,
        1.15,
        .05
    );

    car.add(cabin);


    /* WINDSHIELD */

    const windshield=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.5,
            .43,
            .06
        ),

        glass
    );

    windshield.position.set(
        0,
        1.2,
        -.86
    );

    windshield.rotation.x=
        Math.PI/2.75;

    car.add(windshield);


    /* SIDE WINDOWS */

    for(
        const x of [-.87,.87]
    ){

        const window=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .04,
                .38,
                1.25
            ),

            glass
        );

        window.position.set(
            x,
            1.18,
            .08
        );

        car.add(window);

    }


    /* SIDE SKIRTS */

    for(
        const x of [-1.3,1.3]
    ){

        const skirt=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .12,
                .35,
                3.6
            ),

            black
        );

        skirt.position.set(
            x,
            .48,
            .05
        );

        car.add(skirt);

    }


    /* SPOILER */

    const spoiler=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.6,
            .12,
            .35
        ),

        black
    );

    spoiler.position.set(
        0,
        1.28,
        2.05
    );

    car.add(spoiler);


    /* SPOILER POSTS */

    for(
        const x of [-.8,.8]
    ){

        const post=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .09,
                .5,
                .09
            ),

            black
        );

        post.position.set(
            x,
            1.03,
            2
        );

        car.add(post);

    }


    /* WHEELS */

    const frontWheels=[];

    for(
        const x of [-1.32,1.32]
    ){

        for(
            const z of [-1.5,1.5]
        ){

            const wheelGroup=
            new THREE.Group();

            wheelGroup.position.set(
                x,
                .5,
                z
            );


            const wheel=
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .5,
                    .5,
                    .34,
                    24
                ),

                black
            );

            wheel.rotation.z=
                Math.PI/2;

            wheelGroup.add(wheel);


            const rim=
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .25,
                    .25,
                    .36,
                    20
                ),

                silver
            );

            rim.rotation.z=
                Math.PI/2;

            wheelGroup.add(rim);


            car.add(wheelGroup);


            if(z<0){
                frontWheels.push(
                    wheelGroup
                );
            }

        }

    }


    /* HEADLIGHTS */

    const headlight=
    new THREE.MeshStandardMaterial({

        color:0xffffff,

        emissive:0xffffff,

        emissiveIntensity:4

    });


    for(
        const x of [-.75,.75]
    ){

        const light=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .52,
                .13,
                .08
            ),

            headlight
        );

        light.position.set(
            x,
            .83,
            -2.36
        );

        car.add(light);

    }


    /* TAIL LIGHT */

    const tail=
    new THREE.MeshStandardMaterial({

        color:0xff1010,

        emissive:0xff0000,

        emissiveIntensity:2

    });


    for(
        const x of [-.75,.75]
    ){

        const light=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .55,
                .12,
                .08
            ),

            tail
        );

        light.position.set(
            x,
            .8,
            2.39
        );

        car.add(light);

    }


    /* =====================================
       INTERIOR
    ===================================== */

    const interior=
    new THREE.Group();


    /* SEATS */

    for(
        const x of [-.48,.48]
    ){

        const seat=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .5,
                .7,
                .55
            ),

            black
        );

        seat.position.set(
            x,
            1.05,
            .25
        );

        interior.add(seat);

    }


    /* DASHBOARD */

    const dashboard=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.6,
            .25,
            .55
        ),

        black
    );

    dashboard.position.set(
        0,
        1.05,
        -.7
    );

    interior.add(dashboard);


    /* STEERING */

    const steeringWheel=
    new THREE.Mesh(

        new THREE.TorusGeometry(
            .22,
            .045,
            8,
            24
        ),

        silver
    );

    steeringWheel.position.set(
        -.42,
        1.28,
        -.75
    );

    steeringWheel.rotation.x=
        Math.PI/2;

    interior.add(steeringWheel);


    /* CENTER */

    const steeringCenter=
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .055,
            .055,
            .08,
            12
        ),

        black
    );

    steeringCenter.position.set(
        -.42,
        1.28,
        -.75
    );

    steeringCenter.rotation.x=
        Math.PI/2;

    interior.add(
        steeringCenter
    );


    car.add(interior);


    /* STORE */

    car.userData.frontWheels=
        frontWheels;

    car.userData.interior=
        interior;

    car.userData.steeringWheel=
        steeringWheel;


    return car;
}


/* =========================================
   PLAYER
========================================= */

const player=
createCar(0x713bea);

scene.add(player);


/* =========================================
   AI
========================================= */

const ai=[];

const colors=[
    0xf02030,
    0xff9f00,
    0x00aeea
];

colors.forEach(
    (color,i)=>{

        const car=
        createCar(color);

        car.position.set(
            (i-1)*5,
            0,
            -35-i*20
        );

        scene.add(car);

        ai.push({

            car,

            speed:
                100+
                Math.random()*35

        });

    }
);


/* =========================================
   VARIABLES
========================================= */

let playing=false;

let speed=0;

let fuel=100;

let distance=0;

let lap=1;

let playerX=0;

let steering=0;

let accelerate=false;

let brake=false;

let nitro=false;

let cockpit=false;

let wheelAngle=0;


/* =========================================
   KEYBOARD
========================================= */

const keys={};

window.addEventListener(
    "keydown",
    e=>{
        keys[e.key.toLowerCase()]=true;
    }
);

window.addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);


/* =========================================
   BUTTONS
========================================= */

function holdButton(
    element,
    callback
){

    const down=e=>{
        e.preventDefault();
        callback(true);
    };

    const up=e=>{
        e.preventDefault();
        callback(false);
    };

    element.addEventListener(
        "touchstart",
        down,
        {passive:false}
    );

    element.addEventListener(
        "touchend",
        up,
        {passive:false}
    );

    element.addEventListener(
        "touchcancel",
        up,
        {passive:false}
    );

    element.addEventListener(
        "mousedown",
        down
    );

    element.addEventListener(
        "mouseup",
        up
    );

    element.addEventListener(
        "mouseleave",
        up
    );
}


holdButton(
    document.getElementById("accelerate"),
    v=>accelerate=v
);

holdButton(
    document.getElementById("brake"),
    v=>brake=v
);

holdButton(
    document.getElementById("nitro"),
    v=>nitro=v
);


/* =========================================
   STEERING WHEEL TOUCH
========================================= */

const wheel=
document.getElementById("steering");

let touching=false;

wheel.addEventListener(
    "touchstart",
    e=>{
        touching=true;
        e.preventDefault();
    },
    {passive:false}
);


wheel.addEventListener(
    "touchmove",
    e=>{

        if(!touching)return;

        e.preventDefault();

        const rect=
            wheel.getBoundingClientRect();

        const center=
            rect.left+
            rect.width/2;

        steering=
            THREE.MathUtils.clamp(
                (
                    e.touches[0].clientX-
                    center
                )/
                (rect.width/2),
                -1,
                1
            );

    },
    {passive:false}
);


wheel.addEventListener(
    "touchend",
    ()=>{
        touching=false;
        steering=0;
    }
);


/* =========================================
   CAMERA SWITCH
========================================= */

document.getElementById(
    "cameraBtn"
).onclick=()=>{

    cockpit=!cockpit;

    document.getElementById(
        "cameraBtn"
    ).textContent=
        cockpit
        ?"🎥 CHASE"
        :"🎥 COCKPIT";

};


/* =========================================
   START
========================================= */

document.getElementById(
    "start"
).onclick=()=>{

    playing=true;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "hud"
    ).style.display="block";

};


/* =========================================
   CLOCK
========================================= */

const clock=
new THREE.Clock();


/* =========================================
   GAME LOOP
========================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );


    if(playing){

        /* INPUT */

        const gas=
            accelerate||
            keys.w||
            keys.arrowup;

        const braking=
            brake||
            keys.s||
            keys.arrowdown;

        const boost=
            nitro||
            keys.shift;


        /* ACCELERATION */

        if(gas){

            speed+=
                115*dt;

        }else{

            speed-=
                20*dt;

        }


        /* BRAKE */

        if(braking){

            speed-=
                150*dt;

        }


        /* NITRO */

        if(
            boost&&
            fuel>0&&
            speed>30
        ){

            speed+=
                300*dt;

            fuel-=
                55*dt;

        }else{

            fuel+=
                12*dt;

        }


        fuel=
        THREE.MathUtils.clamp(
            fuel,
            0,
            100
        );


        /* SPEED */

        const maxSpeed=
            boost&&fuel>0
            ?450
            :250;

        speed=
        THREE.MathUtils.clamp(
            speed,
            0,
            maxSpeed
        );


        /* STEERING */

        let steer=
            steering;


        if(
            keys.a||
            keys.arrowleft
        ){

            steer=-1;

        }


        if(
            keys.d||
            keys.arrowright
        ){

            steer=1;

        }


        playerX+=
            steer*
            (
                8+
                speed*.025
            )*
            dt;


        playerX=
        THREE.MathUtils.clamp(
            playerX,
            -8,
            8
        );


        player.position.x=
        THREE.MathUtils.lerp(
            player.position.x,
            playerX,
            .3
        );


        /* =================================
           WHEEL VISUAL STEERING
        ================================= */

        wheelAngle=
        THREE.MathUtils.lerp(
            wheelAngle,
            steer*.65,
            .18
        );


        wheel.style.transform=
            `rotate(${wheelAngle*57}deg)`;


        /* FRONT CAR WHEELS */

        player.userData.frontWheels
            .forEach(
                w=>{
                    w.rotation.y=
                        steer*.45;
                }
            );


        /* INTERIOR STEERING WHEEL */

        if(
            player.userData.steeringWheel
        ){

            player.userData
                .steeringWheel
                .rotation.z=
                    -steer*.8;

        }


        /* CAR BODY LEAN */

        player.rotation.z=
        THREE.MathUtils.lerp(
            player.rotation.z,
            -steer*.1,
            .15
        );


        /* =================================
           FORWARD
        ================================= */

        const movement=
            speed*
            dt*
            .075;

        player.position.z-=
            movement;

        distance+=
            movement;


        /* =================================
           AI
        ================================= */

        ai.forEach(
            opponent=>{

                opponent.car.position.z-=
                    opponent.speed*
                    dt*
                    .075;


                if(
                    opponent.car.position.z<
                    player.position.z-200
                ){

                    opponent.car.position.z=
                        player.position.z+
                        350+
                        Math.random()*100;

                    opponent.car.position.x=
                        Math.random()*15-7.5;

                }

            }
        );


        /* =================================
           LAP
        ================================= */

        if(distance>=500){

            distance=0;

            lap++;

            if(lap>3){

                playing=false;

                alert(
                    "🏁 RACE FINISHED!\n\n"+
                    "GUDU RACING"
                );

                location.reload();

            }

        }


        /* =================================
           CAMERA
        ================================= */

        if(cockpit){

            /*
             * CAMERA INSIDE CAR
             */

            const cockpitPosition=
            new THREE.Vector3(
                -.0,
                1.45,
                -.55
            );

            cockpitPosition.applyMatrix4(
                player.matrixWorld
            );

            camera.position.lerp(
                cockpitPosition,
                .25
            );


            const look=
            new THREE.Vector3(
                player.position.x,
                1.1,
                player.position.z-30
            );

            camera.lookAt(look);


            camera.fov=
                THREE.MathUtils.lerp(
                    camera.fov,
                    boost?85:68,
                    .1
                );

        }else{

            /*
             * CHASE CAMERA
             */

            camera.position.x=
            THREE.MathUtils.lerp(
                camera.position.x,
                player.position.x,
                .1
            );

            camera.position.y=
            THREE.MathUtils.lerp(
                camera.position.y,
                5.2,
                .1
            );

            camera.position.z=
            THREE.MathUtils.lerp(
                camera.position.z,
                player.position.z+12,
                .13
            );

            camera.lookAt(
                player.position.x,
                .7,
                player.position.z-20
            );

            camera.fov=
            THREE.MathUtils.lerp(
                camera.fov,
                boost?78:65,
                .1
            );

        }


        camera.updateProjectionMatrix();


        /* =================================
           HUD
        ================================= */

        document.getElementById(
            "speed"
        ).innerHTML=
            Math.floor(speed)+
            ' <small>KM/H</small>';


        document.getElementById(
            "lap"
        ).textContent=
            lap;


        document.getElementById(
            "nitroFill"
        ).style.width=
            fuel+"%";


        let position=1;

        ai.forEach(
            opponent=>{

                if(
                    opponent.car.position.z>
                    player.position.z
                ){

                    position++;

                }

            }
        );


        document.getElementById(
            "position"
        ).textContent=
            position;

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
