<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GUDU RACING V4 - REALISTIC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;background:#82c8ed;font-family:Arial,sans-serif}
canvas{display:block}
#menu{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(circle,#303030,#050505 72%);color:white;text-align:center}
.logo{font-size:clamp(45px,11vw,100px);font-weight:900;letter-spacing:7px}
.logo span{color:#ff3030}
.subtitle{color:#aaa;letter-spacing:3px;margin:12px 0 35px}
#start{border:0;padding:17px 50px;border-radius:12px;background:white;color:#111;font-size:17px;font-weight:bold;cursor:pointer}
#hud{display:none;position:fixed;inset:0;z-index:20;pointer-events:none;color:white}
#top{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;gap:7px}
.box{padding:9px 12px;background:rgba(0,0,0,.55);border-radius:11px;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);font-size:12px}
#speed{font-size:24px;font-weight:bold}
#speed small{font-size:9px;color:#aaa}
#cameraBtn{pointer-events:auto;position:absolute;top:70px;right:15px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.6);color:white;padding:11px 15px;border-radius:10px;font-weight:bold;cursor:pointer}
#nitroWrap{position:absolute;left:50%;transform:translateX(-50%);bottom:25px;width:280px}
#nitroTitle{text-align:center;font-size:10px;letter-spacing:3px;margin-bottom:5px;text-shadow:0 1px 3px #000}
#nitroBar{height:12px;width:100%;background:#111;border:1px solid #777;border-radius:20px;overflow:hidden}
#nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#00d9ff,#00ff88);transition:width .2s}

/* === COCKPIT PHOTO JESA === */
#cockpitOverlay{display:none;position:fixed;left:0;right:0;bottom:0;z-index:25;pointer-events:none;height:42vh}
#cockpitImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:bottom center;filter:contrast(1.08) saturate(1.1)}
#cockpitFallback{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,#0a0a0a 18%,#111 45%,#000 100%);display:none}
#cockpitFallback:before{content:"";position:absolute;top:18%;left:0;right:0;height:3px;background:#1e40af;opacity:.8}
#dashInfo{position:absolute;left:0;right:0;bottom:0;height:100%;display:flex;align-items:flex-end;justify-content:space-between;padding:0 4% 2%}
.dash-card{background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 12px;text-align:center;min-width:90px}
.dash-card b{font-size:22px;color:#fff}
.dash-card span{font-size:10px;color:#aaa;letter-spacing:1px}
#steerVisual{width:110px;height:110px;border:10px solid #1e40af;border-radius:50%;background:rgba(0,0,0,.4);position:relative;box-shadow:0 0 0 4px #111,0 10px 20px rgba(0,0,0,.5);transition:transform .08s linear;flex-shrink:0}
#steerVisual:before{content:"";position:absolute;left:50%;top:50%;width:8px;height:78px;background:#e5e7eb;transform:translate(-50%,-50%)}
#steerVisual:after{content:"";position:absolute;left:50%;top:50%;width:78px;height:8px;background:#e5e7eb;transform:translate(-50%,-50%)}
#steerCenter2{position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;background:#111;border:4px solid #3b82f6;transform:translate(-50%,-50%);z-index:2;display:flex;align-items:center;justify-content:center;font-size:14px}
#speedoBig{position:absolute;left:50%;transform:translateX(-50%);bottom:38%;background:rgba(0,0,0,.7);border:1px solid #3b82f6;border-radius:16px;padding:8px 18px;text-align:center}
#speedoBig b{font-size:28px;color:#fff}
#speedoBig span{font-size:10px;color:#60a5fa;display:block;letter-spacing:2px}

#steering{display:none;position:fixed;z-index:50;left:20px;bottom:25px;width:130px;height:130px;border:11px solid rgba(255,255,255,.8);border-radius:50%;background:rgba(0,0,0,.3);box-shadow:0 8px 25px rgba(0,0,0,.45);touch-action:none;transition:transform .08s linear}
#steering .v{position:absolute;width:8px;height:90px;background:white;left:50%;top:50%;transform:translate(-50%,-50%)}
#steering .h{position:absolute;width:90px;height:8px;background:white;left:50%;top:50%;transform:translate(-50%,-50%)}
#steerCenter{position:absolute;width:34px;height:34px;border-radius:50%;background:#111;border:5px solid #ddd;left:50%;top:50%;transform:translate(-50%,-50%)}
#controls{display:none;position:fixed;right:15px;bottom:22px;z-index:50;gap:9px;align-items:flex-end}
.control{width:75px;height:75px;border:0;border-radius:50%;color:white;font-weight:bold;font-size:10px;touch-action:none;box-shadow:0 7px 18px rgba(0,0,0,.4)}
#brake{background:rgba(210,30,30,.8)}
#accelerate{background:rgba(0,175,75,.85)}
#nitro{width:85px;height:85px;background:rgba(0,155,220,.85)}
@media(max-width:800px){#steering{display:block}#controls{display:flex}#nitroWrap{bottom:160px;width:180px}#cockpitOverlay{height:38vh}#dashInfo{padding:0 2% 1%}.dash-card{min-width:70px;padding:6px 8px}.dash-card b{font-size:18px}#steerVisual{width:88px;height:88px;border-width:8px}}
</style>
</head>
<body>

<div id="menu">
<div class="logo">GUDU<span> RACING</span></div>
<div class="subtitle">DRIVE • DRIFT • DOMINATE • REALISTIC V4</div>
<button id="start">START RACE</button>
<p style="font-size:11px;color:#666;margin-top:14px">Cockpit me PHOTO jesa dashboard — cockpit.jpg daalo!</p>
</div>

<div id="hud">
<div id="top">
<div class="box">LAP <b id="lap">1</b> / 3</div>
<div class="box">POS <b id="position">1</b> / 4</div>
<div class="box" id="speed">0 <small>KM/H</small></div>
</div>
<button id="cameraBtn">🎥 COCKPIT</button>
<div id="nitroWrap"><div id="nitroTitle">NITRO BOOST</div><div id="nitroBar"><div id="nitroFill"></div></div></div>
</div>

<!-- COCKPIT OVERLAY - PHOTO JESA -->
<div id="cockpitOverlay">
<!-- Agar cockpit.jpg hai to ye dikhega, nahi to fallback -->
<img id="cockpitImg" src="cockpit.jpg" onerror="this.style.display='none';document.getElementById('cockpitFallback').style.display='block'">
<div id="cockpitFallback"></div>
<div id="speedoBig"><b id="speedBig">0</b><span>KM/H • GUDU</span></div>
<div id="dashInfo">
<div class="dash-card"><span>GEAR</span><br><b id="gearTxt">1</b></div>
<div id="steerVisual"><div id="steerCenter2">🔵</div></div>
<div class="dash-card"><span>LAP</span><br><b><span id="lap2">1</span>/3</b><br><span style="color:#60a5fa">POS <span id="pos2">1</span>/4</span></div>
</div>
</div>

<div id="steering"><div class="v"></div><div class="h"></div><div id="steerCenter"></div></div>

<div id="controls">
<button class="control" id="brake">BRAKE</button>
<button class="control" id="accelerate">ACCEL</button>
<button class="control" id="nitro">NITRO</button>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,120,700);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

const sun=new THREE.DirectionalLight(0xfff2cc,3.2);
sun.position.set(100,150,70); sun.castShadow=true;
sun.shadow.camera.left=-80; sun.shadow.camera.right=80; sun.shadow.camera.top=80; sun.shadow.camera.bottom=-80; sun.shadow.mapSize.set(2048,2048);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd9ff,0x2e7d32,1.5));
// Sun disc - realistic glare
const sunMesh=new THREE.Mesh(new THREE.SphereGeometry(18,16,16),new THREE.MeshBasicMaterial({color:0xfff59d}));
sunMesh.position.set(300,180,-600); scene.add(sunMesh);

function mat(color,metal=0,rough=.5){return new THREE.MeshStandardMaterial({color,metalness:metal,roughness:rough});}

// Ground - realistic grass with 2 tones
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1800,1800),mat(0x2f7a3d,0,1));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
// Grass patches
for(let i=0;i<120;i++){
  const p=new THREE.Mesh(new THREE.CircleGeometry(6+Math.random()*10,10),mat(Math.random()>.5?0x3a8a4a:0x256b32,0,1));
  p.rotation.x=-Math.PI/2; p.position.set((Math.random()-.5)*900,0.01,-Math.random()*1200); scene.add(p);
}

const ROAD=3000;
const road=new THREE.Mesh(new THREE.PlaneGeometry(22,ROAD),new THREE.MeshStandardMaterial({color:0x2b2b2b,roughness:.9,metalness:.1}));
road.rotation.x=-Math.PI/2; road.position.set(0,.02,-ROAD/2); road.receiveShadow=true; scene.add(road);
// Road shoulder - asphalt shine
const shoulder=new THREE.Mesh(new THREE.PlaneGeometry(24,ROAD),new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:.4,metalness:.2,transparent:true,opacity:.25}));
shoulder.rotation.x=-Math.PI/2; shoulder.position.set(0,.015,-ROAD/2); scene.add(shoulder);

for(let z=10;z>-ROAD;z-=14){
  const line=new THREE.Mesh(new THREE.BoxGeometry(.35,.06,7),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:.2}));
  line.position.set(0,.08,z); scene.add(line);
}
for(let z=0;z>-ROAD;z-=7){
  for(const x of [-11.8,11.8]){
    const curb=new THREE.Mesh(new THREE.BoxGeometry(1.3,.35,3.5),mat(Math.floor(-z/7)%2===0?0xffffff:0xe01d2d));
    curb.position.set(x,.18,z); curb.castShadow=true; scene.add(curb);
  }
}
// Side white lines - continuous
for(const x of [-10.5,10.5]){
  const l=new THREE.Mesh(new THREE.BoxGeometry(.4,.05,ROAD),mat(0xffffff));
  l.position.set(x,.06,-ROAD/2); scene.add(l);
}

// Trees - more realistic 2-layer
function tree(x,z){
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,3.2,8),mat(0x5d3a1a));
  trunk.position.set(x,1.6,z); trunk.castShadow=true; scene.add(trunk);
  const c1=new THREE.Mesh(new THREE.SphereGeometry(2.1,12,10),mat(0x14532d,0,.9));
  c1.position.set(x,4.2,z); c1.castShadow=true; scene.add(c1);
  const c2=new THREE.Mesh(new THREE.SphereGeometry(1.4,10,8),mat(0x22c55e,0,.9));
  c2.position.set(x+.7,5.1,z+.4); scene.add(c2);
}
for(let i=0;i<280;i++){const side=Math.random()<.5?-1:1; tree(side*(17+Math.random()*45),-Math.random()*ROAD);}
// Buildings - city feel
for(let i=0;i<40;i++){
  const h=12+Math.random()*28; const b=new THREE.Mesh(new THREE.BoxGeometry(12+Math.random()*10,h,12),mat([0x94a3b8,0xcbd5e1,0x64748b,0x475569][i%4],.1,.8));
  const side=i%2===0?-1:1; b.position.set(side*(35+Math.random()*30),h/2,-Math.random()*2800); b.castShadow=true; scene.add(b);
  // Windows glow
  for(let w=0;w<4;w++){const win=new THREE.Mesh(new THREE.PlaneGeometry(1.2,1.6),new THREE.MeshBasicMaterial({color:0xfde68a})); win.position.set(b.position.x-4+w*2.5,h/2,b.position.z+6.1); scene.add(win);}
}
// Mountains far
for(let i=0;i<12;i++){
  const m=new THREE.Mesh(new THREE.ConeGeometry(90+Math.random()*60,80+Math.random()*60,6),mat(0x4a6b4a,0,1));
  m.position.set((i-6)*150,20,-900-Math.random()*200); scene.add(m);
}
// Clouds - realistic white
const clouds=[];
for(let i=0;i<14;i++){
  const g=new THREE.Group();
  for(let j=0;j<4;j++){const s=new THREE.Mesh(new THREE.SphereGeometry(14+Math.random()*12,10,8),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.92,roughness:1})); s.position.set(j*16-24,Math.random()*4,0); g.add(s);}
  g.position.set((Math.random()-.5)*800,120+Math.random()*60,-Math.random()*800); scene.add(g); clouds.push(g);
}

function createCar(color){
  const car=new THREE.Group();
  const paint=new THREE.MeshStandardMaterial({color,metalness:.9,roughness:.12,envMapIntensity:1.2});
  const black=mat(0x050505,.25,.25);
  const glass=new THREE.MeshStandardMaterial({color:0x0f2436,metalness:.4,roughness:.05});
  const silver=mat(0xd1d5db,.95,.12);
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.5,.48,4.7),paint); body.position.y=.67; body.castShadow=true; car.add(body);
  const nose=new THREE.Mesh(new THREE.BoxGeometry(2.25,.28,1.35),paint); nose.position.set(0,.82,-1.7); car.add(nose);
  // Hood shine
  const hood=new THREE.Mesh(new THREE.BoxGeometry(2.1,.06,1.2),new THREE.MeshStandardMaterial({color,metalness:1,roughness:.05})); hood.position.set(0,.98,-1.55); car.add(hood);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.72,.62,1.9),paint); cabin.position.set(0,1.15,.05); cabin.castShadow=true; car.add(cabin);
  const windshield=new THREE.Mesh(new THREE.BoxGeometry(1.5,.43,.06),glass); windshield.position.set(0,1.2,-.86); windshield.rotation.x=Math.PI/2.75; car.add(windshield);
  for(const x of [-.87,.87]){const w=new THREE.Mesh(new THREE.BoxGeometry(.04,.38,1.25),glass); w.position.set(x,1.18,.08); car.add(w);}
  for(const x of [-1.3,1.3]){const s=new THREE.Mesh(new THREE.BoxGeometry(.12,.35,3.6),black); s.position.set(x,.48,.05); car.add(s);}
  const spoiler=new THREE.Mesh(new THREE.BoxGeometry(2.6,.12,.35),black); spoiler.position.set(0,1.28,2.05); car.add(spiler);
  for(const x of [-.8,.8]){const p=new THREE.Mesh(new THREE.BoxGeometry(.09,.5,.09),black); p.position.set(x,1.03,2); car.add(p);}
  const frontWheels=[];
  for(const x of [-1.32,1.32]){for(const z of [-1.5,1.5]){const wg=new THREE.Group(); wg.position.set(x,.5,z);
    const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.34,24),black); wheel.rotation.z=Math.PI/2; wg.add(wheel);
    const rim=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.36,20),silver); rim.rotation.z=Math.PI/2; wg.add(rim);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.38,10),mat(0x111111)); hub.rotation.z=Math.PI/2; wg.add(hub);
    car.add(wg); if(z<0) frontWheels.push(wg);}}
  const headMat=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:4});
  for(const x of [-.75,.75]){const l=new THREE.Mesh(new THREE.BoxGeometry(.52,.13,.08),headMat); l.position.set(x,.83,-2.36); car.add(l);}
  const tailMat=new THREE.MeshStandardMaterial({color:0xff1010,emissive:0xff0000,emissiveIntensity:2.5});
  for(const x of [-.75,.75]){const l=new THREE.Mesh(new THREE.BoxGeometry(.55,.12,.08),tailMat); l.position.set(x,.8,2.39); car.add(l);}
  // Interior - PHOTO JESA - Black leather + Blue stitch
  const interior=new THREE.Group();
  for(const x of [-.48,.48]){
    const seat=new THREE.Mesh(new THREE.BoxGeometry(.5,.7,.55),new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:.9}));
    seat.position.set(x,1.05,.25); interior.add(seat);
    const headrest=new THREE.Mesh(new THREE.BoxGeometry(.42,.22,.18),new THREE.MeshStandardMaterial({color:0x111111,roughness:.9}));
    headrest.position.set(x,1.5,.35); interior.add(headrest);
  }
  const dashboard=new THREE.Mesh(new THREE.BoxGeometry(1.6,.25,.55),new THREE.MeshStandardMaterial({color:0x0f172a,roughness:.35,metalness:.2}));
  dashboard.position.set(0,1.05,-.7); interior.add(dashboard);
  // Dashboard blue line - photo jesa
  const blueLine=new THREE.Mesh(new THREE.BoxGeometry(1.62,.04,.06),new THREE.MeshStandardMaterial({color:0x2563eb,emissive:0x2563eb,emissiveIntensity:1.2}));
  blueLine.position.set(0,1.14,-.98); interior.add(blueLine);
  const steeringWheel=new THREE.Mesh(new THREE.TorusGeometry(.22,.045,8,24),silver);
  steeringWheel.position.set(-.42,1.28,-.75); steeringWheel.rotation.x=Math.PI/2; interior.add(steeringWheel);
  const sc=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.08,12),black); sc.position.set(-.42,1.28,-.75); sc.rotation.x=Math.PI/2; interior.add(sc);
  car.add(interior);
  car.userData.frontWheels=frontWheels; car.userData.interior=interior; car.userData.steeringWheel=steeringWheel;
  return car;
}

const player=createCar(0x1e40af); scene.add(player);
const ai=[]; const colors=[0xf02030,0xff9f00,0x00aeea];
colors.forEach((color,i)=>{const car=createCar(color); car.position.set((i-1)*5,0,-35-i*20); scene.add(car); ai.push({car,speed:100+Math.random()*35});});

let playing=false, speed=0, fuel=100, distance=0, lap=1, playerX=0, steering=0, accelerate=false, brake=false, nitro=false, cockpit=false, wheelAngle=0;
const keys={};
window.addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true});
window.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
function holdButton(el,cb){
  const down=e=>{e.preventDefault(); cb(true)}; const up=e=>{e.preventDefault(); cb(false)};
  el.addEventListener("touchstart",down,{passive:false}); el.addEventListener("touchend",up,{passive:false}); el.addEventListener("touchcancel",up,{passive:false});
  el.addEventListener("mousedown",down); el.addEventListener("mouseup",up); el.addEventListener("mouseleave",up);
}
holdButton(document.getElementById("accelerate"),v=>accelerate=v);
holdButton(document.getElementById("brake"),v=>brake=v);
holdButton(document.getElementById("nitro"),v=>nitro=v);

const wheel=document.getElementById("steering"); let touching=false;
wheel.addEventListener("touchstart",e=>{touching=true; e.preventDefault()},{passive:false});
wheel.addEventListener("touchmove",e=>{if(!touching)return; e.preventDefault(); const rect=wheel.getBoundingClientRect(); const center=rect.left+rect.width/2; steering=THREE.MathUtils.clamp((e.touches[0].clientX-center)/(rect.width/2),-1,1)},{passive:false});
wheel.addEventListener("touchend",()=>{touching=false; steering=0});

document.getElementById("cameraBtn").onclick=()=>{
  cockpit=!cockpit;
  document.getElementById("cameraBtn").textContent=cockpit?"🎥 CHASE":"🎥 COCKPIT";
  document.getElementById("cockpitOverlay").style.display=cockpit?"block":"none";
  // Cockpit me HUD speed chhupao - dashboard me dikhega
  document.getElementById("speed").style.opacity=cockpit?"0.3":"1";
};
document.getElementById("start").onclick=()=>{playing=true; document.getElementById("menu").style.display="none"; document.getElementById("hud").style.display="block";};

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  if(playing){
    const gas=accelerate||keys.w||keys.arrowup;
    const braking=brake||keys.s||keys.arrowdown;
    const boost=nitro||keys.shift;
    if(gas) speed+=115*dt; else speed-=20*dt;
    if(braking) speed-=150*dt;
    if(boost&&fuel>0&&speed>30){speed+=300*dt; fuel-=55*dt;} else fuel+=12*dt;
    fuel=THREE.MathUtils.clamp(fuel,0,100);
    const maxSpeed=boost&&fuel>0?450:250;
    speed=THREE.MathUtils.clamp(speed,0,maxSpeed);
    let steer=steering;
    if(keys.a||keys.arrowleft) steer=-1;
    if(keys.d||keys.arrowright) steer=1;
    playerX+=steer*(8+speed*.025)*dt;
    playerX=THREE.MathUtils.clamp(playerX,-8,8);
    player.position.x=THREE.MathUtils.lerp(player.position.x,playerX,.3);
    wheelAngle=THREE.MathUtils.lerp(wheelAngle,steer*.65,.18);
    wheel.style.transform=`rotate(${wheelAngle*57}deg)`;
    document.getElementById("steerVisual").style.transform=`rotate(${wheelAngle*57}deg)`;
    player.userData.frontWheels.forEach(w=>{w.rotation.y=steer*.45});
    if(player.userData.steeringWheel) player.userData.steeringWheel.rotation.z=-steer*.8;
    player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,-steer*.1,.15);
    const movement=speed*dt*.075;
    player.position.z-=movement; distance+=movement;
    // Clouds move - realistic
    clouds.forEach((c,i)=>{c.position.x+=dt*(1+i%3); if(c.position.x>500) c.position.x=-500;});
    ai.forEach(op=>{op.car.position.z-=op.speed*dt*.075; if(op.car.position.z<player.position.z-200){op.car.position.z=player.position.z+350+Math.random()*100; op.car.position.x=Math.random()*15-7.5;}});
    if(distance>=500){distance=0; lap++; if(lap>3){playing=false; alert("🏁 RACE FINISHED!\n\nGUDU RACING - REALISTIC!"); location.reload();}}
    if(cockpit){
      const cp=new THREE.Vector3(0,1.45,-.55); cp.applyMatrix4(player.matrixWorld);
      camera.position.lerp(cp,.25);
      const look=new THREE.Vector3(player.position.x,1.1,player.position.z-30);
      camera.lookAt(look);
      camera.fov=THREE.MathUtils.lerp(camera.fov,boost?85:68,.1);
    }else{
      camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x,.1);
      camera.position.y=THREE.MathUtils.lerp(camera.position.y,5.2,.1);
      camera.position.z=THREE.MathUtils.lerp(camera.position.z,player.position.z+12,.13);
      camera.lookAt(player.position.x,.7,player.position.z-20);
      camera.fov=THREE.MathUtils.lerp(camera.fov,boost?78:65,.1);
    }
    camera.updateProjectionMatrix();
    const kmh=Math.floor(speed);
    document.getElementById("speed").innerHTML=kmh+' <small>KM/H</small>';
    document.getElementById("speedBig").innerText=kmh;
    document.getElementById("lap").textContent=lap;
    document.getElementById("lap2").innerText=lap;
    document.getElementById("nitroFill").style.width=fuel+"%";
    const gear=kmh<40?"1":kmh<80?"2":kmh<130?"3":kmh<180?"4":kmh<230?"5":"6";
    document.getElementById("gearTxt").innerText=gear;
    let position=1; ai.forEach(op=>{if(op.car.position.z>player.position.z) position++;});
    document.getElementById("position").textContent=position;
    document.getElementById("pos2").innerText=position;
  }
  renderer.render(scene,camera);
}
animate();
window.addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
