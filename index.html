<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>GUDU RACING</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    background:#79bce5;
    font-family:Arial,Helvetica,sans-serif;
    user-select:none;
}

canvas{
    display:block;
}


/* ================= MENU ================= */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
    radial-gradient(circle at center,#252525 0%,#090909 55%,#000 100%);
    color:white;
    text-align:center;
}

.logo{
    font-size:clamp(45px,11vw,105px);
    font-weight:900;
    letter-spacing:7px;
}

.logo span{
    color:#ef3030;
}

.subtitle{
    color:#aaa;
    margin-top:10px;
    margin-bottom:35px;
    letter-spacing:3px;
}

#start{
    border:none;
    padding:17px 48px;
    border-radius:12px;
    background:white;
    color:#111;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}


/* ================= HUD ================= */

#hud{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    color:white;
}

#top{
    position:absolute;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
}

.hudBox{
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.18);
    padding:10px 14px;
    border-radius:12px;
    backdrop-filter:blur(8px);
    font-size:13px;
}

#speed{
    font-size:25px;
    font-weight:bold;
}

#speed small{
    font-size:10px;
    color:#aaa;
}


/* ================= NITRO ================= */

#nitroContainer{
    position:absolute;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    width:280px;
}

#nitroLabel{
    color:white;
    text-align:center;
    font-size:11px;
    letter-spacing:3px;
    margin-bottom:6px;
}

#nitroBar{
    width:100%;
    height:12px;
    background:#111;
    border:1px solid #777;
    border-radius:20px;
    overflow:hidden;
}

#nitroFill{
    width:100%;
    height:100%;
    background:#00e5ff;
}


/* ================= STEERING ================= */

#steering{
    display:none;
    position:fixed;
    z-index:50;
    left:20px;
    bottom:25px;

    width:135px;
    height:135px;

    border-radius:50%;

    border:12px solid rgba(255,255,255,.8);

    background:
    radial-gradient(
        circle,
        rgba(0,0,0,.5),
        rgba(0,0,0,.25)
    );

    box-shadow:
    0 8px 30px rgba(0,0,0,.45);

    touch-action:none;
}

#steering:before{
    content:"";
    position:absolute;

    width:8px;
    height:92px;

    background:white;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);
}

#steering:after{
    content:"";
    position:absolute;

    width:92px;
    height:8px;

    background:white;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);
}

#center{
    position:absolute;

    width:35px;
    height:35px;

    border-radius:50%;

    background:#111;
    border:5px solid #ddd;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:5;
}


/* ================= PEDALS ================= */

#controls{
    display:none;

    position:fixed;
    right:18px;
    bottom:22px;

    z-index:50;

    gap:10px;

    align-items:flex-end;
}

.control{
    border:none;
    color:white;
    font-weight:bold;

    border-radius:50%;

    width:78px;
    height:78px;

    font-size:11px;

    touch-action:none;

    box-shadow:
    0 8px 20px rgba(0,0,0,.35);
}

#accelerate{
    background:rgba(0,170,70,.75);
}

#brake{
    background:rgba(210,35,35,.75);
}

#nitro{
    width:88px;
    height:88px;
    background:rgba(0,170,220,.75);
}


/* ================= MOBILE ================= */

@media(max-width:800px){

    #steering{
        display:block;
    }

    #controls{
        display:flex;
    }

    #nitroContainer{
        bottom:155px;
        width:190px;
    }

    #top{
        font-size:11px;
    }

    .hudBox{
        padding:8px 10px;
    }

}

</style>
</head>


<body>


<!-- ================= MENU ================= -->

<div id="menu">

    <div class="logo">
        GUDU<span> RACING</span>
    </div>

    <div class="subtitle">
        DRIVE • DRIFT • DOMINATE
    </div>

    <button id="start">
        START RACE
    </button>

</div>


<!-- ================= HUD ================= -->

<div id="hud">

    <div id="top">

        <div class="hudBox">
            LAP <b id="lap">1</b> / 3
        </div>

        <div class="hudBox">
            POSITION
            <b id="position">1</b> / 4
        </div>

        <div class="hudBox" id="speed">
            0
            <small>KM/H</small>
        </div>

    </div>


    <div id="nitroContainer">

        <div id="nitroLabel">
            NITRO BOOST
        </div>

        <div id="nitroBar">
            <div id="nitroFill"></div>
        </div>

    </div>

</div>


<!-- ================= MOBILE ================= -->

<div id="steering">

    <div id="center"></div>

</div>


<div id="controls">

    <button
        class="control"
        id="brake">
        BRAKE
    </button>

    <button
        class="control"
        id="accelerate">
        ACCEL
    </button>

    <button
        class="control"
        id="nitro">
        NITRO
    </button>

</div>


<script type="module">


import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =====================================================
   SCENE
===================================================== */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x82c5ea);

scene.fog =
new THREE.Fog(
    0x82c5ea,
    120,
    800
);


/* =====================================================
   CAMERA
===================================================== */

const camera =
new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .1,
    1500
);

camera.position.set(
    0,
    5,
    12
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

const sun =
new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(
    100,
    150,
    80
);

sun.castShadow=true;

scene.add(sun);


scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x385d36,
        1.3
    )
);


/* =====================================================
   MATERIAL HELPERS
===================================================== */

function mat(
    color,
    metal=.0,
    rough=.5
){

    return new THREE.MeshStandardMaterial({

        color:color,

        metalness:metal,

        roughness:rough

    });

}


/* =====================================================
   GROUND
===================================================== */

const ground =
new THREE.Mesh(

    new THREE.PlaneGeometry(
        1600,
        1600
    ),

    mat(
        0x28763d,
        0,
        1
    )

);

ground.rotation.x=
-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =====================================================
   ROAD
===================================================== */

const roadLength=2500;

const road =
new THREE.Mesh(

    new THREE.PlaneGeometry(
        22,
        roadLength
    ),

    mat(
        0x222222,
        0,
        .95
    )

);

road.rotation.x=
-Math.PI/2;

road.position.y=.02;

road.position.z=
-roadLength/2;

road.receiveShadow=true;

scene.add(road);


/* =====================================================
   ROAD MARKINGS
===================================================== */

for(
    let z=10;
    z>-roadLength;
    z-=14
){

    const line =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .3,
            .06,
            7
        ),

        mat(0xffffff)
    );

    line.position.set(
        0,
        .08,
        z
    );

    scene.add(line);

}


/* =====================================================
   SIDE CURBS
===================================================== */

for(
    let z=0;
    z>-roadLength;
    z-=7
){

    for(
        const x of [-11.7,11.7]
    ){

        const curb =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.2,
                .3,
                3.5
            ),

            mat(
                (Math.floor(-z/7)%2===0)
                ? 0xffffff
                : 0xd51f2b
            )

        );

        curb.position.set(
            x,
            .15,
            z
        );

        scene.add(curb);

    }

}


/* =====================================================
   TREES
===================================================== */

function tree(x,z){

    const trunk =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .35,
            .45,
            3,
            8
        ),

        mat(0x704214)
    );

    trunk.position.set(
        x,
        1.5,
        z
    );

    trunk.castShadow=true;

    scene.add(trunk);


    const crown =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.8,
            10,
            8
        ),

        mat(0x176b35)
    );

    crown.position.set(
        x,
        3.5,
        z
    );

    crown.castShadow=true;

    scene.add(crown);

}


for(
    let i=0;
    i<230;
    i++
){

    const side =
        Math.random()<.5
        ? -1
        : 1;

    const x =
        side*
        (17+
        Math.random()*45);

    const z =
        -Math.random()*
        roadLength;

    tree(
        x,
        z
    );

}


/* =====================================================
   REALISTIC-STYLE SUPERCAR
===================================================== */

function createSuperCar(color){

    const car =
    new THREE.Group();


    const paint =
    mat(
        color,
        .75,
        .2
    );


    const dark =
    mat(
        0x070707,
        .25,
        .22
    );


    const glass =
    new THREE.MeshStandardMaterial({

        color:0x102d45,

        metalness:.25,

        roughness:.08,

        transparent:true,

        opacity:.9

    });


    const chrome =
    mat(
        0xc9c9c9,
        .9,
        .15
    );


    /* ---------- MAIN BODY ---------- */

    const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.45,
            .48,
            4.65
        ),

        paint
    );

    body.position.y=.67;

    body.castShadow=true;

    car.add(body);


    /* ---------- FRONT NOSE ---------- */

    const nose =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.25,
            .28,
            1.25
        ),

        paint
    );

    nose.position.set(
        0,
        .82,
        -1.72
    );

    nose.rotation.x=.025;

    car.add(nose);


    /* ---------- FRONT SPLITTER ---------- */

    const splitter =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.38,
            .08,
            .35
        ),

        dark
    );

    splitter.position.set(
        0,
        .48,
        -2.27
    );

    car.add(splitter);


    /* ---------- CABIN ---------- */

    const cabin =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.72,
            .62,
            1.85
        ),

        paint
    );

    cabin.position.set(
        0,
        1.15,
        .05
    );

    cabin.rotation.x=-.035;

    cabin.castShadow=true;

    car.add(cabin);


    /* ---------- WINDSHIELD ---------- */

    const windshield =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.48,
            .43,
            .06
        ),

        glass
    );

    windshield.position.set(
        0,
        1.19,
        -.84
    );

    windshield.rotation.x=
    Math.PI/2.75;

    car.add(windshield);


    /* ---------- REAR WINDOW ---------- */

    const rearWindow =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.48,
            .38,
            .06
        ),

        glass
    );

    rearWindow.position.set(
        0,
        1.18,
        .91
    );

    rearWindow.rotation.x=
    -Math.PI/2.8;

    car.add(rearWindow);


    /* ---------- SIDE MIRRORS ---------- */

    for(
        const x of [-1.15,1.15]
    ){

        const mirror =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .35,
                .12,
                .22
            ),

            paint
        );

        mirror.position.set(
            x,
            1.18,
            -.55
        );

        car.add(mirror);

    }


    /* ---------- SIDE SKIRTS ---------- */

    for(
        const x of [-1.28,1.28]
    ){

        const skirt =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .13,
                .34,
                3.55
            ),

            dark
        );

        skirt.position.set(
            x,
            .48,
            .1
        );

        car.add(skirt);

    }


    /* ---------- REAR ---------- */

    const rear =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.35,
            .38,
            .65
        ),

        paint
    );

    rear.position.set(
        0,
        .72,
        2.08
    );

    car.add(rear);


    /* ---------- SPOILER ---------- */

    const spoiler =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.55,
            .12,
            .35
        ),

        dark
    );

    spoiler.position.set(
        0,
        1.28,
        2.05
    );

    car.add(spoiler);


    /* ---------- SPOILER POSTS ---------- */

    for(
        const x of [-.78,.78]
    ){

        const post =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .09,
                .48,
                .09
            ),

            dark
        );

        post.position.set(
            x,
            1.02,
            2.0
        );

        car.add(post);

    }


    /* ---------- WHEELS ---------- */

    const wheelMat =
    mat(
        0x050505,
        .1,
        .45
    );


    for(
        const x of [-1.3,1.3]
    ){

        for(
            const z of [-1.48,1.48]
        ){

            const wheel =
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .49,
                    .49,
                    .32,
                    24
                ),

                wheelMat
            );

            wheel.rotation.z=
            Math.PI/2;

            wheel.position.set(
                x,
                .5,
                z
            );

            wheel.castShadow=true;

            car.add(wheel);


            const rim =
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .25,
                    .25,
                    .34,
                    20
                ),

                chrome
            );

            rim.rotation.z=
            Math.PI/2;

            rim.position.set(
                x,
                .5,
                z
            );

            car.add(rim);

        }

    }


    /* ---------- HEADLIGHTS ---------- */

    const headlightMat =
    new THREE.MeshStandardMaterial({

        color:0xffffff,

        emissive:0xffffff,

        emissiveIntensity:4

    });


    for(
        const x of [-.72,.72]
    ){

        const light =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .5,
                .13,
                .08
            ),

            headlightMat
        );

        light.position.set(
            x,
            .82,
            -2.34
        );

        car.add(light);

    }


    /* ---------- TAILLIGHT ---------- */

    const tailMat =
    new THREE.MeshStandardMaterial({

        color:0xff1111,

        emissive:0xff0000,

        emissiveIntensity:2

    });


    for(
        const x of [-.72,.72]
    ){

        const light =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .55,
                .12,
                .08
            ),

            tailMat
        );

        light.position.set(
            x,
            .78,
            2.39
        );

        car.add(light);

    }


    return car;

}


/* =====================================================
   PLAYER
===================================================== */

const player =
createSuperCar(
    0x6734e8
);

player.position.set(
    0,
    0,
    0
);

scene.add(player);


/* =====================================================
   AI
===================================================== */

const aiCars=[];

const aiColors=[
    0xff2020,
    0xffa500,
    0x00aeea
];

aiColors.forEach(
    (color,i)=>{

        const car =
        createSuperCar(color);

        car.position.set(
            (i-1)*5,
            0,
            -35-(i*20)
        );

        scene.add(car);

        aiCars.push({

            mesh:car,

            speed:
                85+
                Math.random()*35

        });

    }
);


/* =====================================================
   GAME VARIABLES
===================================================== */

let running=false;

let speed=0;

let playerX=0;

let nitro=100;

let distance=0;

let lap=1;

let steering=0;

let accelerating=false;

let braking=false;

let boosting=false;


/* =====================================================
   KEYBOARD
===================================================== */

const keys={};

document.addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=true;

    }
);

document.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;

    }
);


/* =====================================================
   TOUCH BUTTON
===================================================== */

function buttonHold(
    element,
    callback
){

    element.addEventListener(
        "touchstart",
        e=>{

            e.preventDefault();

            callback(true);

        },
        {
            passive:false
        }
    );


    element.addEventListener(
        "touchend",
        e=>{

            e.preventDefault();

            callback(false);

        },
        {
            passive:false
        }
    );

}


buttonHold(
    document.getElementById("accelerate"),
    value=>accelerating=value
);

buttonHold(
    document.getElementById("brake"),
    value=>braking=value
);

buttonHold(
    document.getElementById("nitro"),
    value=>boosting=value
);


/* =====================================================
   STEERING WHEEL
===================================================== */

const wheel=
document.getElementById(
    "steering"
);

let touching=false;


wheel.addEventListener(
    "touchstart",
    e=>{

        touching=true;

        e.preventDefault();

    },
    {
        passive:false
    }
);


wheel.addEventListener(
    "touchmove",
    e=>{

        if(!touching)
            return;

        e.preventDefault();

        const rect=
        wheel.getBoundingClientRect();

        const centerX=
        rect.left+
        rect.width/2;

        const x=
        e.touches[0].clientX;

        steering=
        THREE.MathUtils.clamp(
            (x-centerX)/
            (rect.width/2),
            -1,
            1
        );

    },
    {
        passive:false
    }
);


wheel.addEventListener(
    "touchend",
    ()=>{

        touching=false;

        steering=0;

    }
);


/* =====================================================
   START
===================================================== */

document.getElementById(
    "start"
).onclick=()=>{

    running=true;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "hud"
    ).style.display="block";

};


/* =====================================================
   GAME LOOP
===================================================== */

const clock=
new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const delta=
    Math.min(
        clock.getDelta(),
        .05
    );


    if(running){

        /* ======================
           INPUT
        ====================== */

        const gas=
        accelerating ||
        keys.w ||
        keys.arrowup;


        const brake=
        braking ||
        keys.s ||
        keys.arrowdown;


        const nitro=
        boosting ||
        keys.shift;


        /* ======================
           ACCELERATION
        ====================== */

        if(gas){

            speed +=
            95*delta;

        }else{

            speed -=
            20*delta;

        }


        if(brake){

            speed -=
            120*delta;

        }


        /* ======================
           NITRO
        ====================== */

        if(
            nitro &&
            nitro>0 &&
            speed>40
        ){

            speed +=
            220*delta;

            nitro -=
            45*delta;

        }else{

            nitro +=
            10*delta;

        }


        nitro=
        THREE.MathUtils.clamp(
            nitro,
            0,
            100
        );


        /* ======================
           SPEED LIMIT
        ====================== */

        const maximum=
        nitro && nitro>0
        ? 430
        : 240;


        speed=
        THREE.MathUtils.clamp(
            speed,
            0,
            maximum
        );


        /* ======================
           STEERING
        ====================== */

        let steer=
        steering;


        if(
            keys.a ||
            keys.arrowleft
        ){

            steer=-1;

        }


        if(
            keys.d ||
            keys.arrowright
        ){

            steer=1;

        }


        playerX +=
        steer*
        (
            8+
            speed*.025
        )*
        delta;


        playerX=
        THREE.MathUtils.clamp(
            playerX,
            -8,
            8
        );


        player.position.x=
        THREE.MathUtils.lerp(
            player.position.x,
            playerX,
            .25
        );


        /* ======================
           CAR LEAN
        ====================== */

        player.rotation.z=
        THREE.MathUtils.lerp(
            player.rotation.z,
            -steer*.09,
            .15
        );


        /* ======================
           ACTUAL FORWARD MOVEMENT
        ====================== */

        const movement=
        speed*
        delta*
        .065;


        player.position.z -=
        movement;


        distance +=
        movement;


        /* ======================
           AI
        ====================== */

        aiCars.forEach(
            ai=>{

                ai.mesh.position.z -=
                ai.speed*
                delta*
                .065;


                if(
                    ai.mesh.position.z <
                    player.position.z-180
                ){

                    ai.mesh.position.z=
                    player.position.z+
                    350+
                    Math.random()*150;


                    ai.mesh.position.x=
                    Math.random()*15-7.5;

                }

            }
        );


        /* ======================
           LAP
        ====================== */

        if(
            distance>=500
        ){

            distance=0;

            lap++;


            if(lap>3){

                running=false;

                alert(
                    "🏁 RACE FINISHED!\n\n"+
                    "GUDU RACING"
                );

                document.getElementById(
                    "menu"
                ).style.display="flex";

                document.getElementById(
                    "hud"
                ).style.display="none";

            }

        }


        /* ======================
           CAMERA
        ====================== */

        camera.position.x=
        THREE.MathUtils.lerp(
            camera.position.x,
            player.position.x,
            .1
        );


        camera.position.z=
        THREE.MathUtils.lerp(
            camera.position.z,
            player.position.z+12,
            .12
        );


        camera.position.y=
        THREE.MathUtils.lerp(
            camera.position.y,
            5.4,
            .1
        );


        camera.lookAt(
            player.position.x,
            .8,
            player.position.z-20
        );


        /* ======================
           HUD
        ====================== */

        document.getElementById(
            "speed"
        ).innerHTML=
        Math.floor(speed)+
        ' <small>KM/H</small>';


        document.getElementById(
            "lap"
        ).textContent=
        lap;


        document.getElementById(
            "nitroFill"
        ).style.width=
        nitro+"%";


        /* ======================
           POSITION
        ====================== */

        let position=1;


        aiCars.forEach(
            ai=>{

                if(
                    ai.mesh.position.z>
                    player.position.z
                ){

                    position++;

                }

            }
        );


        document.getElementById(
            "position"
        ).textContent=
        position;

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
        innerWidth/
        innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
