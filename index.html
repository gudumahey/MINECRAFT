<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXORA BLOCKS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:25px;
    pointer-events:none;
    z-index:10;
    text-shadow:0 0 5px #000;
}

#menu{
    position:fixed;
    top:15px;
    left:15px;
    z-index:20;
    color:white;
    background:rgba(0,0,0,.45);
    padding:12px 16px;
    border-radius:12px;
    backdrop-filter:blur(8px);
}

#menu b{
    font-size:18px;
}

#menu small{
    display:block;
    margin-top:5px;
    opacity:.8;
}

#hotbar{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
    z-index:20;
}

.slot{
    width:55px;
    height:55px;
    border:2px solid rgba(255,255,255,.5);
    background:rgba(0,0,0,.55);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:bold;
}

.slot.active{
    border:3px solid white;
    transform:translateY(-4px);
}

#start{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:linear-gradient(#07111dcc,#000000ee);
    color:white;
    text-align:center;
}

#start h1{
    font-size:48px;
    letter-spacing:4px;
}

#start p{
    margin:12px 0 25px;
    opacity:.8;
}

#play{
    border:0;
    padding:15px 35px;
    border-radius:12px;
    background:white;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

#mobile{
    display:none;
}

@media(max-width:700px){
    #start h1{
        font-size:32px;
    }

    #mobile{
        display:block;
        position:fixed;
        bottom:95px;
        left:20px;
        z-index:30;
    }

    .mrow{
        display:flex;
        justify-content:center;
    }

    .mbtn{
        width:55px;
        height:55px;
        margin:3px;
        border:1px solid #ffffff66;
        background:#0008;
        color:white;
        border-radius:12px;
        font-size:20px;
    }

    #jump{
        position:fixed;
        right:20px;
        bottom:100px;
    }
}
</style>
</head>

<body>

<div id="start">
    <h1>NEXORA BLOCKS</h1>
    <p>A tiny browser-based block world</p>
    <button id="play">PLAY WORLD</button>
</div>

<div id="menu">
    <b>🌍 NEXORA BLOCKS</b>
    <small>WASD • Mouse • Space • Left/Right Click</small>
</div>

<div id="crosshair">+</div>

<div id="hotbar">
    <div class="slot active">🌱</div>
    <div class="slot">🟫</div>
    <div class="slot">🪨</div>
    <div class="slot">🟨</div>
</div>

<div id="mobile">
    <div class="mrow">
        <button class="mbtn" data-key="w">▲</button>
    </div>
    <div class="mrow">
        <button class="mbtn" data-key="a">◀</button>
        <button class="mbtn" data-key="s">▼</button>
        <button class="mbtn" data-key="d">▶</button>
    </div>
</div>

<button id="jump" class="mbtn" style="display:none">↑</button>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {PointerLockControls} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/PointerLockControls.js";

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(0x87ceeb,25,100);

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth/innerHeight,
    0.1,
    200
);

camera.position.set(0,3,6);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

document.body.appendChild(renderer.domElement);


/* LIGHT */

const sun = new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(20,30,10);
scene.add(sun);

scene.add(new THREE.HemisphereLight(
    0xffffff,
    0x555555,
    1
));


/* CONTROLS */

const controls = new PointerLockControls(
    camera,
    document.body
);


/* BLOCK MATERIALS */

const materials = {

    grass:new THREE.MeshLambertMaterial({
        color:0x4caf50
    }),

    dirt:new THREE.MeshLambertMaterial({
        color:0x795548
    }),

    stone:new THREE.MeshLambertMaterial({
        color:0x777777
    }),

    sand:new THREE.MeshLambertMaterial({
        color:0xd8c27a
    })

};


/* BLOCKS */

const blockSize = 1;

const blocks = [];

function createBlock(x,y,z,type="grass"){

    const geometry = new THREE.BoxGeometry(
        blockSize,
        blockSize,
        blockSize
    );

    const cube = new THREE.Mesh(
        geometry,
        materials[type]
    );

    cube.position.set(x,y,z);

    cube.userData.type = type;

    scene.add(cube);

    blocks.push(cube);

    return cube;
}


/* WORLD */

for(let x=-15;x<=15;x++){

    for(let z=-15;z<=15;z++){

        createBlock(x,0,z,"grass");
        createBlock(x,-1,z,"dirt");

        if(Math.random()<0.08){

            createBlock(
                x,
                1,
                z,
                "stone"
            );

        }
    }
}


/* TREES */

function tree(x,z){

    for(let y=1;y<=3;y++){

        createBlock(x,y,z,"dirt");

    }

    for(let dx=-1;dx<=1;dx++){

        for(let dz=-1;dz<=1;dz++){

            createBlock(
                x+dx,
                4,
                z+dz,
                "grass"
            );

        }

    }

    createBlock(x,5,z,"grass");
}

for(let i=0;i<15;i++){

    const x=Math.floor(Math.random()*25)-12;
    const z=Math.floor(Math.random()*25)-12;

    tree(x,z);
}


/* MOVEMENT */

const keys={};

document.addEventListener(
    "keydown",
    e=>{
        keys[e.key.toLowerCase()]=true;

        if(e.code==="Space"){
            jump();
        }
    }
);

document.addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);

let velocityY=0;
let onGround=false;

function jump(){

    if(onGround){

        velocityY=0.18;
        onGround=false;

    }
}


/* BREAK / PLACE */

const raycaster = new THREE.Raycaster();

function getBlock(){

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const hits=raycaster.intersectObjects(
        blocks,
        false
    );

    if(hits.length && hits[0].distance<6){

        return hits[0];

    }

    return null;
}

document.addEventListener(
    "mousedown",
    e=>{

        if(!controls.isLocked)return;

        const hit=getBlock();

        if(!hit)return;

        if(e.button===0){

            scene.remove(hit.object);

            const index=blocks.indexOf(hit.object);

            if(index>-1){
                blocks.splice(index,1);
            }

        }

        if(e.button===2){

            const normal=hit.face.normal.clone();

            const pos=hit.object.position.clone();

            pos.add(normal);

            createBlock(
                Math.round(pos.x),
                Math.round(pos.y),
                Math.round(pos.z),
                "grass"
            );

        }

    }
);

document.addEventListener(
    "contextmenu",
    e=>e.preventDefault()
);


/* START */

document.getElementById("play")
.addEventListener(
    "click",
    ()=>{

        controls.lock();

        document.getElementById("start").style.display="none";

    }
);


/* MOBILE */

document.querySelectorAll(".mbtn")
.forEach(btn=>{

    const key=btn.dataset.key;

    btn.addEventListener(
        "touchstart",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );

    btn.addEventListener(
        "touchend",
        e=>{
            e.preventDefault();
            keys[key]=false;
        }
    );

});


/* GAME LOOP */

const clock=new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const delta=Math.min(
        clock.getDelta(),
        0.05
    );

    if(controls.isLocked){

        const speed=5*delta;

        if(keys.w)
            controls.moveForward(speed);

        if(keys.s)
            controls.moveForward(-speed);

        if(keys.a)
            controls.moveRight(-speed);

        if(keys.d)
            controls.moveRight(speed);

        velocityY-=0.5*delta;

        camera.position.y+=velocityY;

        if(camera.position.y<2){

            camera.position.y=2;

            velocityY=0;

            onGround=true;

        }

    }

    renderer.render(scene,camera);

}

animate();


/* RESIZE */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
