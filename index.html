<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GUDU RACING</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    background:#80c8ed;
    font-family:Arial, sans-serif;
}

canvas{
    display:block;
}

/* MENU */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#292929,#050505 70%);
    color:white;
    text-align:center;
}

.logo{
    font-size:clamp(45px,11vw,100px);
    font-weight:900;
    letter-spacing:6px;
}

.logo span{
    color:#ff3030;
}

.subtitle{
    margin:12px 0 35px;
    color:#aaa;
    letter-spacing:3px;
}

#start{
    border:0;
    padding:17px 50px;
    border-radius:12px;
    background:white;
    color:#111;
    font-size:17px;
    font-weight:bold;
}

/* HUD */

#hud{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    color:white;
}

#top{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    gap:7px;
}

.box{
    padding:9px 12px;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.2);
    border-radius:11px;
    backdrop-filter:blur(8px);
    font-size:12px;
}

#speed{
    font-size:24px;
    font-weight:bold;
}

#speed small{
    font-size:9px;
    color:#aaa;
}

#nitroWrap{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:25px;
    width:280px;
}

#nitroTitle{
    text-align:center;
    font-size:10px;
    letter-spacing:3px;
    color:white;
    margin-bottom:5px;
}

#nitroBar{
    height:12px;
    width:100%;
    border-radius:20px;
    background:#111;
    border:1px solid #777;
    overflow:hidden;
}

#nitroFill{
    height:100%;
    width:100%;
    background:#00d9ff;
}

/* STEERING */

#steering{
    display:none;
    position:fixed;
    z-index:50;
    bottom:25px;
    left:20px;
    width:130px;
    height:130px;
    border:11px solid rgba(255,255,255,.8);
    border-radius:50%;
    background:rgba(0,0,0,.3);
    box-shadow:0 8px 25px rgba(0,0,0,.45);
    touch-action:none;
}

#steering .v{
    position:absolute;
    width:8px;
    height:90px;
    background:white;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

#steering .h{
    position:absolute;
    width:90px;
    height:8px;
    background:white;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

#steerCenter{
    position:absolute;
    width:34px;
    height:34px;
    border-radius:50%;
    background:#111;
    border:5px solid #ddd;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:3;
}

/* BUTTONS */

#controls{
    display:none;
    position:fixed;
    right:15px;
    bottom:22px;
    z-index:50;
    gap:9px;
    align-items:flex-end;
}

.control{
    width:75px;
    height:75px;
    border:0;
    border-radius:50%;
    color:white;
    font-weight:bold;
    font-size:10px;
    touch-action:none;
    box-shadow:0 7px 18px rgba(0,0,0,.4);
}

#brake{
    background:rgba(210,30,30,.78);
}

#accelerate{
    background:rgba(0,175,75,.82);
}

#nitro{
    width:85px;
    height:85px;
    background:rgba(0,155,220,.82);
}

@media(max-width:800px){

    #steering{
        display:block;
    }

    #controls{
        display:flex;
    }

    #nitroWrap{
        bottom:160px;
        width:180px;
    }
}
</style>
</head>

<body>

<div id="menu">

    <div class="logo">
        GUDU<span> RACING</span>
    </div>

    <div class="subtitle">
        DRIVE • DRIFT • DOMINATE
    </div>

    <button id="start">
        START RACE
    </button>

</div>

<div id="hud">

    <div id="top">

        <div class="box">
            LAP <b id="lap">1</b> / 3
        </div>

        <div class="box">
            POS <b id="position">1</b> / 4
        </div>

        <div class="box" id="speed">
            0 <small>KM/H</small>
        </div>

    </div>

    <div id="nitroWrap">

        <div id="nitroTitle">
            NITRO BOOST
        </div>

        <div id="nitroBar">
            <div id="nitroFill"></div>
        </div>

    </div>

</div>

<div id="steering">

    <div class="v"></div>
    <div class="h"></div>
    <div id="steerCenter"></div>

</div>

<div id="controls">

    <button class="control" id="brake">
        BRAKE
    </button>

    <button class="control" id="accelerate">
        ACCEL
    </button>

    <button class="control" id="nitro">
        NITRO
    </button>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* ===============================
   SCENE
=============================== */

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x82c8ed);

scene.fog =
new THREE.Fog(
    0x82c8ed,
    120,
    800
);


/* ===============================
   CAMERA
=============================== */

const camera =
new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    .1,
    1500
);


/* ===============================
   RENDERER
=============================== */

const renderer =
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
    renderer.domElement
);


/* ===============================
   LIGHT
=============================== */

const sun =
new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(
    100,
    150,
    70
);

sun.castShadow=true;

scene.add(sun);

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x376b3b,
        1.3
    )
);


/* ===============================
   MATERIAL
=============================== */

function material(
    color,
    metal=0,
    rough=.5
){

    return new THREE.MeshStandardMaterial({
        color,
        metalness:metal,
        roughness:rough
    });

}


/* ===============================
   GROUND
=============================== */

const ground =
new THREE.Mesh(

    new THREE.PlaneGeometry(
        1800,
        1800
    ),

    material(
        0x28783d,
        0,
        1
    )

);

ground.rotation.x=-Math.PI/2;

scene.add(ground);


/* ===============================
   ROAD
=============================== */

const ROAD_LENGTH=3000;

const road =
new THREE.Mesh(

    new THREE.PlaneGeometry(
        22,
        ROAD_LENGTH
    ),

    material(
        0x252525,
        0,
        .95
    )

);

road.rotation.x=-Math.PI/2;

road.position.set(
    0,
    .02,
    -ROAD_LENGTH/2
);

scene.add(road);


/* ===============================
   ROAD LINES
=============================== */

for(
    let z=10;
    z>-ROAD_LENGTH;
    z-=14
){

    const line =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            .35,
            .06,
            7
        ),

        material(0xffffff)
    );

    line.position.set(
        0,
        .08,
        z
    );

    scene.add(line);
}


/* ===============================
   CURBS
=============================== */

for(
    let z=0;
    z>-ROAD_LENGTH;
    z-=7
){

    for(
        const x of [-11.8,11.8]
    ){

        const curb =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.3,
                .35,
                3.5
            ),

            material(
                Math.floor(-z/7)%2===0
                ? 0xffffff
                : 0xe01d2d
            )
        );

        curb.position.set(
            x,
            .18,
            z
        );

        scene.add(curb);
    }
}


/* ===============================
   TREES
=============================== */

function makeTree(x,z){

    const trunk =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .35,
            .48,
            3,
            8
        ),

        material(0x704214)
    );

    trunk.position.set(
        x,
        1.5,
        z
    );

    scene.add(trunk);


    const leaves =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.8,
            10,
            8
        ),

        material(0x176b35)
    );

    leaves.position.set(
        x,
        3.5,
        z
    );

    scene.add(leaves);
}


for(
    let i=0;
    i<280;
    i++
){

    const side=
        Math.random()<.5 ? -1 : 1;

    makeTree(

        side*(17+
        Math.random()*45),

        -Math.random()*ROAD_LENGTH

    );
}


/* ===============================
   CAR
=============================== */

function createCar(color){

    const car =
    new THREE.Group();


    const paint =
    material(
        color,
        .75,
        .2
    );


    const black =
    material(
        0x050505,
        .2,
        .25
    );


    const glass =
    new THREE.MeshStandardMaterial({

        color:0x10283b,

        metalness:.3,

        roughness:.08,

        transparent:true,

        opacity:.9

    });


    const silver =
    material(
        0xbfc4c9,
        .9,
        .15
    );


    /* BODY */

    const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.5,
            .48,
            4.7
        ),

        paint
    );

    body.position.y=.67;

    car.add(body);


    /* FRONT NOSE */

    const nose =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.25,
            .28,
            1.35
        ),

        paint
    );

    nose.position.set(
        0,
        .82,
        -1.7
    );

    car.add(nose);


    /* CABIN */

    const cabin =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.72,
            .62,
            1.9
        ),

        paint
    );

    cabin.position.set(
        0,
        1.15,
        .05
    );

    car.add(cabin);


    /* FRONT GLASS */

    const frontGlass =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.5,
            .43,
            .06
        ),

        glass
    );

    frontGlass.position.set(
        0,
        1.2,
        -.86
    );

    frontGlass.rotation.x=
    Math.PI/2.75;

    car.add(frontGlass);


    /* REAR GLASS */

    const rearGlass =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.5,
            .4,
            .06
        ),

        glass
    );

    rearGlass.position.set(
        0,
        1.18,
        .9
    );

    rearGlass.rotation.x=
    -Math.PI/2.8;

    car.add(rearGlass);


    /* SIDE SKIRTS */

    for(
        const x of [-1.3,1.3]
    ){

        const skirt =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .12,
                .35,
                3.6
            ),

            black
        );

        skirt.position.set(
            x,
            .48,
            .05
        );

        car.add(skirt);
    }


    /* SPOILER */

    const spoiler =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2.6,
            .12,
            .35
        ),

        black
    );

    spoiler.position.set(
        0,
        1.28,
        2.05
    );

    car.add(spoiler);


    /* SPOILER POSTS */

    for(
        const x of [-.8,.8]
    ){

        const post =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .09,
                .5,
                .09
            ),

            black
        );

        post.position.set(
            x,
            1.03,
            2
        );

        car.add(post);
    }


    /* WHEELS */

    for(
        const x of [-1.32,1.32]
    ){

        for(
            const z of [-1.5,1.5]
        ){

            const wheel =
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .5,
                    .5,
                    .34,
                    24
                ),

                black
            );

            wheel.rotation.z=
            Math.PI/2;

            wheel.position.set(
                x,
                .5,
                z
            );

            car.add(wheel);


            const rim =
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .25,
                    .25,
                    .36,
                    20
                ),

                silver
            );

            rim.rotation.z=
            Math.PI/2;

            rim.position.set(
                x,
                .5,
                z
            );

            car.add(rim);
        }
    }


    /* HEADLIGHTS */

    const headlight =
    new THREE.MeshStandardMaterial({

        color:0xffffff,

        emissive:0xffffff,

        emissiveIntensity:4

    });


    for(
        const x of [-.75,.75]
    ){

        const light =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .52,
                .13,
                .08
            ),

            headlight
        );

        light.position.set(
            x,
            .83,
            -2.36
        );

        car.add(light);
    }


    return car;
}


/* ===============================
   PLAYER
=============================== */

const player =
createCar(0x713bea);

player.position.set(
    0,
    0,
    0
);

scene.add(player);


/* ===============================
   AI
=============================== */

const ai=[];

const aiColors=[
    0xf02030,
    0xff9f00,
    0x00aeea
];

aiColors.forEach(
    (color,i)=>{

        const car=
        createCar(color);

        car.position.set(
            (i-1)*5,
            0,
            -35-(i*20)
        );

        scene.add(car);

        ai.push({

            car:car,

            speed:
                100+
                Math.random()*35

        });
    }
);


/* ===============================
   GAME STATE
=============================== */

let playing=false;

let speed=0;

let nitroFuel=100;

let distance=0;

let lap=1;

let playerX=0;

let steer=0;

let accelerate=false;

let brake=false;

let nitro=false;


/* ===============================
   KEYBOARD
=============================== */

const keys={};

window.addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=true;

    }
);

window.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;

    }
);


/* ===============================
   BUTTON HELPER
=============================== */

function holdButton(
    element,
    setValue
){

    function down(e){

        e.preventDefault();

        setValue(true);
    }

    function up(e){

        e.preventDefault();

        setValue(false);
    }

    element.addEventListener(
        "touchstart",
        down,
        {passive:false}
    );

    element.addEventListener(
        "touchend",
        up,
        {passive:false}
    );

    element.addEventListener(
        "touchcancel",
        up,
        {passive:false}
    );

    /* PC TESTING */

    element.addEventListener(
        "mousedown",
        down
    );

    element.addEventListener(
        "mouseup",
        up
    );

    element.addEventListener(
        "mouseleave",
        up
    );
}


holdButton(
    document.getElementById("accelerate"),
    v=>accelerate=v
);

holdButton(
    document.getElementById("brake"),
    v=>brake=v
);

holdButton(
    document.getElementById("nitro"),
    v=>nitro=v
);


/* ===============================
   STEERING WHEEL
=============================== */

const wheel=
document.getElementById(
    "steering"
);

let wheelTouch=false;

wheel.addEventListener(
    "touchstart",
    e=>{

        wheelTouch=true;

        e.preventDefault();

    },
    {passive:false}
);


wheel.addEventListener(
    "touchmove",
    e=>{

        if(!wheelTouch)
            return;

        e.preventDefault();

        const rect=
        wheel.getBoundingClientRect();

        const center=
        rect.left+
        rect.width/2;

        steer=
        THREE.MathUtils.clamp(
            (
                e.touches[0].clientX-
                center
            )/
            (rect.width/2),
            -1,
            1
        );

    },
    {passive:false}
);


wheel.addEventListener(
    "touchend",
    ()=>{

        wheelTouch=false;

        steer=0;

    }
);


/* ===============================
   START
=============================== */

document.getElementById(
    "start"
).onclick=()=>{

    playing=true;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "hud"
    ).style.display="block";

};


/* ===============================
   CLOCK
=============================== */

const clock=
new THREE.Clock();


/* ===============================
   GAME LOOP
=============================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const dt=
    Math.min(
        clock.getDelta(),
        .05
    );


    if(playing){

        /* INPUT */

        const gas=
            accelerate ||
            keys.w ||
            keys.arrowup;

        const braking=
            brake ||
            keys.s ||
            keys.arrowdown;

        const boost=
            nitro ||
            keys.shift;


        /* ======================
           ACCELERATION
        ====================== */

        if(gas){

            speed +=
                110*dt;

        }else{

            speed -=
                22*dt;

        }


        /* BRAKE */

        if(braking){

            speed -=
                150*dt;

        }


        /* ======================
           NITRO
        ====================== */

        if(
            boost &&
            nitroFuel>0 &&
            speed>30
        ){

            speed +=
                300*dt;

            nitroFuel -=
                55*dt;

        }else{

            nitroFuel +=
                13*dt;

        }


        nitroFuel=
        THREE.MathUtils.clamp(
            nitroFuel,
            0,
            100
        );


        /* ======================
           SPEED
        ====================== */

        let maxSpeed=
            boost &&
            nitroFuel>0
            ? 450
            : 250;


        speed=
        THREE.MathUtils.clamp(
            speed,
            0,
            maxSpeed
        );


        /* ======================
           STEERING
        ====================== */

        let steering=
            steer;


        if(
            keys.a ||
            keys.arrowleft
        ){

            steering=-1;

        }

        if(
            keys.d ||
            keys.arrowright
        ){

            steering=1;

        }


        playerX +=
            steering*
            (
                8+
                speed*.025
            )*
            dt;


        playerX=
        THREE.MathUtils.clamp(
            playerX,
            -8,
            8
        );


        player.position.x=
        THREE.MathUtils.lerp(
            player.position.x,
            playerX,
            .3
        );


        /* CAR TILT */

        player.rotation.z=
        THREE.MathUtils.lerp(
            player.rotation.z,
            -steering*.1,
            .15
        );


        /* ======================
           FORWARD MOVEMENT
        ====================== */

        const movement=
            speed*
            dt*
            .075;


        player.position.z -=
            movement;

        distance +=
            movement;


        /* ======================
           AI
        ====================== */

        ai.forEach(
            opponent=>{

                opponent.car.position.z -=
                    opponent.speed*
                    dt*
                    .075;


                if(
                    opponent.car.position.z <
                    player.position.z-200
                ){

                    opponent.car.position.z=
                        player.position.z+
                        350+
                        Math.random()*100;

                    opponent.car.position.x=
                        Math.random()*15-7.5;

                }

            }
        );


        /* ======================
           LAPS
        ====================== */

        if(distance>=500){

            distance=0;

            lap++;

            if(lap>3){

                playing=false;

                alert(
                    "🏁 RACE FINISHED!\n\n"+
                    "GUDU RACING"
                );

                location.reload();

            }

        }


        /* ======================
           CAMERA
        ====================== */

        camera.position.x=
        THREE.MathUtils.lerp(
            camera.position.x,
            player.position.x,
            .1
        );

        camera.position.y=
        THREE.MathUtils.lerp(
            camera.position.y,
            5.2,
            .1
        );

        camera.position.z=
        THREE.MathUtils.lerp(
            camera.position.z,
            player.position.z+12,
            .13
        );


        camera.lookAt(
            player.position.x,
            .7,
            player.position.z-20
        );


        /* ======================
           HUD
        ====================== */

        document.getElementById(
            "speed"
        ).innerHTML=
            Math.floor(speed)+
            ' <small>KM/H</small>';


        document.getElementById(
            "lap"
        ).textContent=
            lap;


        document.getElementById(
            "nitroFill"
        ).style.width=
            nitroFuel+"%";


        /* POSITION */

        let position=1;

        ai.forEach(
            opponent=>{

                if(
                    opponent.car.position.z >
                    player.position.z
                ){

                    position++;

                }

            }
        );


        document.getElementById(
            "position"
        ).textContent=
            position;

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


/* ===============================
   RESIZE
=============================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
