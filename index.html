<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GUDU GTA - BINA INTERNET - PAKKA CHALEGA!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#0f172a;font-family:Arial;overflow:hidden}
#menu{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(180deg,#1e40af,#0f172a);color:#fff;text-align:center;padding:16px}
.logo{font-size:64px;font-weight:900;letter-spacing:4px}
.logo span{color:#ff3030}
#start{border:0;padding:16px 46px;border-radius:14px;background:#fff;color:#111;font-size:18px;font-weight:900;cursor:pointer;margin-top:16px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#start:active{transform:scale(.96);background:#22c55e;color:#fff}
.feat{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.feat span{background:rgba(255,255,255,.15);padding:7px 11px;border-radius:20px;font-size:11px}
#hud{position:fixed;top:10px;left:10px;right:10px;z-index:5;display:none;justify-content:space-between;color:#fff;pointer-events:none}
.box{background:rgba(0,0,0,.6);padding:8px 11px;border-radius:10px;font-size:12px;font-weight:800}
#game{position:fixed;inset:0;display:none;background:#7db8e8}
canvas{width:100%;height:100%;display:block}
#controls{position:fixed;left:0;right:0;bottom:0;z-index:6;display:none;justify-content:space-between;padding:12px;pointer-events:none}
#controls button{pointer-events:auto;border:0;border-radius:50%;width:72px;height:72px;font-weight:900;font-size:11px;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.4)}
#leftBtns{display:flex;gap:8px;align-items:flex-end}
#rightBtns{display:flex;gap:8px;align-items:flex-end}
#joy{width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.7);position:relative;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 4px 10px rgba(0,0,0,.4)}
#topBtns{position:fixed;top:60px;left:10px;right:10px;z-index:6;display:none;justify-content:space-between;pointer-events:none}
#topBtns button{pointer-events:auto;border:0;padding:10px 14px;border-radius:20px;font-weight:900;font-size:12px;cursor:pointer}
#msg{position:fixed;left:50%;top:120px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:30px;font-weight:800;font-size:13px;z-index:7;display:none;text-align:center;max-width:92%}
#shop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#111;color:#fff;padding:18px;border-radius:18px;z-index:20;display:none;width:92%;max-width:380px;text-align:center}
#shop button{display:block;width:100%;border:0;padding:12px;border-radius:12px;font-weight:800;margin-top:8px;cursor:pointer}
</style>
</head>
<body>
<div id="menu">
<div class="logo">GUDU<span> GTA</span></div>
<p style="color:#cbd5e1;margin-top:8px">BINA INTERNET • PAKKA CHALEGA • NO BLUE SCREEN!</p>
<button id="start" onclick="startGame()">▶️ START GAME</button>
<div class="feat"><span>✈️ Lufthansa 747</span><span>🚗 Car + Race</span><span>🏙️ City + Shops</span><span>🚓 Police</span><span>📱 Mobile</span><span>🕹️ Joystick</span></div>
<p style="font-size:11px;color:#94a3b8;margin-top:12px">Joystick se chalo • ACCEL dabao • E = Plane / Gadi</p>
</div>

<div id="game"><canvas id="cv"></canvas></div>

<div id="hud"><div class="box">💰 ₹<span id="money">5000</span></div><div class="box">⭐ <span id="wanted">0</span> • ❤️ <span id="health">100</span></div><div class="box">🚗 <span id="speed">0</span> KM/H</div></div>
<div id="topBtns"><button style="background:#fb923c;color:#fff" onclick="doAction()">🚪 E — ACTION</button><button style="background:#111;color:#fff;border:2px solid #00d9ff" onclick="togglePhone()">📱 MOBILE</button></div>
<div id="msg"></div>

<div id="controls">
<div id="leftBtns"><div id="joy"><div id="knob"></div></div></div>
<div id="rightBtns"><button style="background:#ef4444" id="brakeBtn">BRAKE</button><button style="background:#22c55e" id="accelBtn">ACCEL</button><button style="background:#38bdf8;width:82px;height:82px" id="nitroBtn">NITRO</button></div>
</div>

<div id="shop">
<h2 id="shopTitle">🏪 Shop</h2>
<p id="shopDesc" style="color:#aaa;font-size:13px;margin:6px 0">Kya loge Boss?</p>
<div id="shopBtns"></div>
<button style="background:#222;color:#fff" onclick="closeShop()">❌ Band Karo</button>
</div>

<script>
// ===== NO CDN - SIRF CANVAS - PAKKA CHALEGA! =====
let cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let W=0,H=0;
function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
window.addEventListener("resize",resize); resize();

let started=false, money=5000, health=100, wanted=0, speed=0, mode="car", onFoot=false, planeAlt=0, planeThrottle=0, camX=0, camY=0;
let player={x:0,y:0,angle:-Math.PI/2, vx:0, vy:0};
let joy={x:0,y:0,active:false};
let keys={};
let cars=[], npcs=[], buildings=[], shops=[], planes=[], police=[];
let shopOpen=false, phoneOpen=false;

function toast(m){ let e=document.getElementById("msg"); e.innerText=m; e.style.display="block"; setTimeout(()=>e.style.display="none",2600); }

// City banao!
for(let i=0;i<22;i++){ buildings.push({x:(Math.random()-0.5)*2000, y:(Math.random()-0.5)*2000, w:90+Math.random()*80, h:90+Math.random()*80, c:["#94a3b8","#cbd5e1","#64748b","#b45309","#e2e8f0"][i%5]}); }
shops.push({x:180,y:-120,type:"gun",title:"🔫 GUN SHOP"});
shops.push({x:-220,y:-320,type:"bar",title:"🍺 GUDU BAR"});
shops.push({x:240,y:-480,type:"restaurant",title:"🍕 RESTAURANT"});
shops.push({x:-260,y:-650,type:"mobile",title:"📱 MOBILE SHOP"});
shops.push({x:280,y:-820,type:"laptop",title:"💻 LAPTOP SHOP"});
for(let i=0;i<14;i++){ cars.push({x:(Math.random()-0.5)*800, y:(Math.random()-0.5)*1000, angle:Math.random()*Math.PI*2, speed:1+Math.random()*2, color:["#ef4444","#22c55e","#facc15","#ec4899","#3b82f6","#ffffff"][i%6]}); }
for(let i=0;i<18;i++){ npcs.push({x:(Math.random()-0.5)*900, y:(Math.random()-0.5)*900, angle:Math.random()*Math.PI*2, speed:0.6+Math.random()*0.8, color:["#ef4444","#3b82f6","#facc15","#22c55e"][i%4]}); }
planes.push({x:500,y:-550,type:"747",angle:0});
planes.push({x:580,y:-400,type:"747",angle:Math.PI});
planes.push({x:420,y:-200,type:"747",angle:0});
for(let i=0;i<3;i++){ police.push({x:-400+i*40,y:300+i*40,active:false,speed:4.5}); }

function startGame(){
  started=true;
  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="block";
  document.getElementById("hud").style.display="flex";
  document.getElementById("controls").style.display="flex";
  document.getElementById("topBtns").style.display="flex";
  player.x=0; player.y=0;
  toast("🚗 GUDU GTA Chal Gaya! Joystick se chalo! Airport jao — 747 udao!");
}

function doAction(){
  // Shop ke paas hai?
  for(let s of shops){ let d=Math.hypot(player.x-s.x, player.y-s.y); if(d<80){ openShop(s.type); return; } }
  // Plane ke paas hai?
  for(let p of planes){ let d=Math.hypot(player.x-p.x, player.y-p.y); if(d<90){ if(mode==="plane"){ mode="car"; planeAlt=0; toast("🚶 747 se utar gaye!"); } else { mode="plane"; planeThrottle=0; planeAlt=0; toast("✈️ LUFTHANSA 747 ME BETH GAYE! ACCEL dabao — Udo!"); } updateHUD(); return; } }
  // Gadi ke paas?
  if(onFoot){ onFoot=false; toast("🚗 Gadi me beth gaye!"); }
  else { onFoot=true; mode="walk"; toast("🚶 Utar gaye! Paidal chalo!"); }
  updateHUD();
}
function openShop(type){
  shopOpen=true;
  let el=document.getElementById("shop"); el.style.display="block";
  let title=document.getElementById("shopTitle"); let btns=document.getElementById("shopBtns");
  if(type==="gun"){ title.innerText="🔫 GUN SHOP"; btns.innerHTML=`<button style="background:#ef4444;color:#fff" onclick="buy('Pistol',1000)">🔫 Pistol — ₹1000</button><button style="background:#111;color:#fff" onclick="buy('AK-47',5000)">🔫 AK-47 — ₹5000</button>`; }
  else if(type==="bar"){ title.innerText="🍺 GUDU BAR"; btns.innerHTML=`<button style="background:#f97316;color:#fff" onclick="buyDrink()">🍺 Drink — ₹200 — Health +10</button>`; }
  else if(type==="restaurant"){ title.innerText="🍕 RESTAURANT"; btns.innerHTML=`<button style="background:#22c55e;color:#fff" onclick="buyFood()">🍕 Pizza — ₹300 — Health +30</button>`; }
  else if(type==="mobile"){ title.innerText="📱 MOBILE SHOP"; btns.innerHTML=`<button style="background:#111;color:#fff" onclick="buy('Phone',2000)">📱 Gudu Phone — ₹2000</button>`; }
  else { title.innerText="💻 LAPTOP SHOP"; btns.innerHTML=`<button style="background:#7c3aed;color:#fff" onclick="buy('Laptop',5000)">💻 Laptop — ₹5000</button>`; }
}
function closeShop(){ shopOpen=false; document.getElementById("shop").style.display="none"; }
function buy(name,price){ if(money<price){ toast("Paisa kam hai Boss!"); return; } money-=price; closeShop(); toast("✅ "+name+" kharid liya!"); updateHUD(); }
function buyDrink(){ if(money<200){toast("Paisa kam!");return;} money-=200; health=Math.min(100,health+10); wanted=Math.max(0,wanted-1); closeShop(); toast("🍺 Drink! Health +10, Wanted kam!"); updateHUD(); }
function buyFood(){ if(money<300){toast("Paisa kam!");return;} money-=300; health=Math.min(100,health+30); closeShop(); toast("🍕 Pizza kha liya! Health +30!"); updateHUD(); }
function togglePhone(){
  phoneOpen=!phoneOpen;
  if(phoneOpen){
    let ans=prompt("📱 GUDU PHONE\n\n1 = Call Gudu\n2 = Bank ₹1000 lo\n3 = Police Rishwat - Wanted kam\n4 = Gudu Card dekho\n\nNumber likho (1-4):");
    if(ans==="1") toast("📞 Gudu ko call lag raha hai... Hello Boss!");
    else if(ans==="2"){ money+=1000; toast("💰 Bank se ₹1000 mile!"); }
    else if(ans==="3"){ wanted=0; toast("🚓 Police ko rishwat — Wanted 0!"); }
    else if(ans==="4") toast("🎫 Gudu Card — 20102610 — 20% OFF!");
    phoneOpen=false;
  }
  updateHUD();
}
function updateHUD(){
  document.getElementById("money").innerText=money;
  document.getElementById("health").innerText=Math.floor(health);
  document.getElementById("wanted").innerText=wanted;
  document.getElementById("speed").innerText=Math.floor(speed);
}

// Joystick!
let joyEl=document.getElementById("joy"), knob=document.getElementById("knob");
function joyMove(e){
  let r=joyEl.getBoundingClientRect();
  let cx=r.left+r.width/2, cy=r.top+r.height/2;
  let tx=(e.touches?e.touches[0].clientX:e.clientX)-cx;
  let ty=(e.touches?e.touches[0].clientY:e.clientY)-cy;
  let d=Math.hypot(tx,ty); let max=38;
  if(d>max){ tx=tx/d*max; ty=ty/d*max; }
  knob.style.transform=`translate(${tx-23}px,${ty-23}px)`;
  joy.x=tx/max; joy.y=ty/max;
}
joyEl.addEventListener("touchstart",e=>{e.preventDefault(); joyMove(e);},{passive:false});
joyEl.addEventListener("touchmove",e=>{e.preventDefault(); joyMove(e);},{passive:false});
joyEl.addEventListener("touchend",()=>{knob.style.transform="translate(-50%,-50%)"; joy.x=0; joy.y=0;});
joyEl.addEventListener("mousedown",e=>{joy.active=true; joyMove(e);});
window.addEventListener("mousemove",e=>{if(joy.active) joyMove(e);});
window.addEventListener("mouseup",()=>{joy.active=false; knob.style.transform="translate(-50%,-50%)"; joy.x=0; joy.y=0;});

let accel=false, brake=false, nitro=false;
function hold(id,fn){ let el=document.getElementById(id); el.addEventListener("touchstart",e=>{e.preventDefault(); fn(true);},{passive:false}); el.addEventListener("touchend",()=>fn(false)); el.addEventListener("mousedown",()=>fn(true)); el.addEventListener("mouseup",()=>fn(false)); }
hold("accelBtn",v=>accel=v); hold("brakeBtn",v=>brake=v); hold("nitroBtn",v=>nitro=v);
window.addEventListener("keydown",e=>{ keys[e.key.toLowerCase()]=true; if(e.key.toLowerCase()==="e") doAction(); if(e.key.toLowerCase()==="w") accel=true; if(e.key.toLowerCase()==="s") brake=true; });
window.addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; if(e.key.toLowerCase()==="w") accel=false; if(e.key.toLowerCase()==="s") brake=false; });

function drawCar(x,y,angle,color,scale=1){
  ctx.save(); ctx.translate(x,y); ctx.rotate(angle+Math.PI/2); ctx.scale(scale,scale);
  // Shadow
  ctx.fillStyle="rgba(0,0,0,.25)"; ctx.fillRect(-16,-26,32,52);
  // Body - shine!
  let grad=ctx.createLinearGradient(-15,0,15,0); grad.addColorStop(0,color); grad.addColorStop(0.5,"#ffffff"); grad.addColorStop(1,color);
  ctx.fillStyle=grad; ctx.fillRect(-15,-26,30,52);
  ctx.fillStyle="rgba(0,0,0,.7)"; ctx.fillRect(-12,-14,24,20); // Cabin
  ctx.fillStyle="#7dd3fc"; ctx.fillRect(-11,-16,22,4); // Windshield shine
  ctx.fillStyle="#111"; ctx.fillRect(-17,-22,6,10); ctx.fillRect(11,-22,6,10); ctx.fillRect(-17,14,6,10); ctx.fillRect(11,14,6,10); // Wheels
  ctx.fillStyle="#fff"; ctx.fillRect(-12,-28,6,3); ctx.fillRect(6,-28,6,3); // Headlight
  ctx.fillStyle="#ff0000"; ctx.fillRect(-12,25,6,3); ctx.fillRect(6,25,6,3); // Tail light
  ctx.restore();
}

function draw747(x,y,angle,scale=1,alt=0){
  ctx.save(); ctx.translate(x,y); ctx.rotate(angle+Math.PI/2); ctx.scale(scale,scale);
  // Shadow - upar hai to chhota!
  let sh=1-alt/200; if(sh<0.4) sh=0.4;
  ctx.fillStyle=`rgba(0,0,0,${0.25*sh})`; ctx.beginPath(); ctx.ellipse(0,0,70,18,0,0,Math.PI*2); ctx.fill();
  // Wings - white!
  ctx.fillStyle="#ffffff"; ctx.fillRect(-85,-8,170,16);
  ctx.fillStyle="#05164d"; ctx.fillRect(-85,-8,8,16); ctx.fillRect(77,-8,8,16); // Wing tips blue
  // Body - white + blue belly!
  ctx.fillStyle="#ffffff"; ctx.fillRect(-14,-95,28,190);
  ctx.fillStyle="#1e3a8a"; ctx.fillRect(-14,40,28,55); // Belly blue
  // Nose - lamba + pointed!
  ctx.beginPath(); ctx.moveTo(-14,-95); ctx.lineTo(0,-125); ctx.lineTo(14,-95); ctx.closePath(); ctx.fillStyle="#ffffff"; ctx.fill();
  // Cockpit - 6 sheeshe!
  ctx.fillStyle="#0a0a0a";
  for(let i=0;i<3;i++){ ctx.fillRect(-11+i*7,-105,5,6); ctx.fillRect(6-i*7,-105,5,6); }
  // Hump - 747 ki pehchan!
  ctx.fillStyle="#ffffff"; ctx.fillRect(-11,-85,22,30);
  ctx.fillStyle="#0a0a0a";
  for(let i=0;i<4;i++){ ctx.fillRect(-9,-82+i*7,5,4); ctx.fillRect(4,-82+i*7,5,4); }
  // Windows!
  ctx.fillStyle="#0a0a0a";
  for(let i=0;i<10;i++){ ctx.fillRect(-12,-50+i*10,4,5); ctx.fillRect(8,-50+i*10,4,5); }
  // Tail - blue + yellow circle!
  ctx.fillStyle="#05164d"; ctx.fillRect(-3,85,6,35);
  ctx.fillStyle="#ffcc00"; ctx.beginPath(); ctx.arc(0,102,10,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#05164d"; ctx.beginPath(); ctx.arc(0,102,6,0,Math.PI*2); ctx.fill();
  // 4 Engines!
  ctx.fillStyle="#111";
  for(let ex of [-55,-28,28,55]){ ctx.fillRect(ex-7,-12,14,24); ctx.fillStyle="#ff9f00"; ctx.fillRect(ex-3,12,6,6); ctx.fillStyle="#111"; }
  // Lufthansa blue line!
  ctx.fillStyle="#05164d"; ctx.fillRect(-14,-20,28,6);
  ctx.restore();
}

function drawNPC(x,y,angle,color){
  ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
  ctx.fillStyle="rgba(0,0,0,.2)"; ctx.beginPath(); ctx.ellipse(0,0,10,12,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=color; ctx.fillRect(-6,-8,12,16);
  ctx.fillStyle="#fbbf24"; ctx.beginPath(); ctx.arc(0,-11,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#111"; ctx.fillRect(-5,6,4,8); ctx.fillRect(1,6,4,8);
  ctx.restore();
}

let last=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!started) return;
  let dt=16/1000;

  // Movement!
  let mx=joy.x, my=joy.y;
  if(keys.a) mx=-1; if(keys.d) mx=1; if(keys.w) my=-1; if(keys.s) my=1;
  if(keys.arrowleft) mx=-1; if(keys.arrowright) mx=1; if(keys.arrowup) my=-1; if(keys.arrowdown) my=1;

  if(mode==="plane"){
    if(accel||my< -0.3) planeThrottle+=40*dt;
    else planeThrottle-=15*dt;
    if(brake) planeThrottle-=50*dt;
    planeThrottle=Math.max(0,Math.min(180,planeThrottle));
    speed=planeThrottle;
    // Mouse / Joystick se mudo!
    player.angle += mx*1.2*dt;
    if(planeThrottle>70) planeAlt+= (planeThrottle-70)*dt*0.8;
    else planeAlt-=20*dt;
    if(planeAlt<0) planeAlt=0;
    player.x += Math.cos(player.angle)*planeThrottle*dt*1.2;
    player.y += Math.sin(player.angle)*planeThrottle*dt*1.2;
    if(planeAlt===0 && planeThrottle>120){ health-=10; toast("💥 747 Crash!"); planeThrottle=0; }
  } else if(onFoot){
    speed=0;
    if(Math.abs(mx)>0.1 || Math.abs(my)>0.1){
      player.angle=Math.atan2(my,mx);
      player.x+=mx*3.2; player.y+=my*3.2;
    }
  } else {
    if(accel||my<-0.3) speed+=90*dt;
    else speed-=20*dt;
    if(brake) speed-=120*dt;
    if(nitro && speed>20) speed+=180*dt;
    speed=Math.max(0,Math.min(nitro?280:180,speed));
    player.angle += mx*1.5*dt*(speed>5?1:0.3);
    player.x+=Math.cos(player.angle)*speed*dt*1.1;
    player.y+=Math.sin(player.angle)*speed*dt*1.1;
    if(speed>150 && Math.random()<0.002){ wanted=Math.min(5,wanted+1); toast("🚓 Overspeed! Wanted ⭐"+wanted); }
  }

  // NPCs!
  for(let n of npcs){ n.angle+= (Math.random()-0.5)*0.05; n.x+=Math.cos(n.angle)*n.speed; n.y+=Math.sin(n.angle)*n.speed; if(Math.abs(n.x-player.x)>800) n.x=player.x+(Math.random()-0.5)*800; if(Math.abs(n.y-player.y)>800) n.y=player.y+(Math.random()-0.5)*800; }
  // Traffic cars!
  for(let c of cars){ c.x+=Math.cos(c.angle)*c.speed; c.y+=Math.sin(c.angle)*c.speed; if(Math.hypot(c.x-player.x,c.y-player.y)>900){ c.x=player.x+(Math.random()-0.5)*900; c.y=player.y+(Math.random()-0.5)*900; c.angle=Math.random()*Math.PI*2; } }
  // Police chase!
  if(wanted>0){
    for(let p of police){
      if(!p.active && Math.random()<0.01){ p.active=true; p.x=player.x+100; p.y=player.y+100; }
      if(p.active){ let dx=player.x-p.x, dy=player.y-p.y, d=Math.hypot(dx,dy); if(d>10){ p.x+=dx/d*p.speed; p.y+=dy/d*p.speed; } }
    }
  } else { for(let p of police) p.active=false; }

  // Camera!
  camX += (player.x-camX)*0.12; camY += (player.y-camY)*0.12;

  // DRAW!
  ctx.fillStyle="#7db8e8"; ctx.fillRect(0,0,W,H);
  // Clouds!
  ctx.fillStyle="rgba(255,255,255,.9)";
  for(let i=0;i<6;i++){ let cx=((i*300 + Date.now()*0.01) % (W+300))-150; let cy=60+i*70; ctx.beginPath(); ctx.ellipse(cx,cy,70,22,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(cx+40,cy,50,18,0,0,Math.PI*2); ctx.fill(); }
  ctx.save();
  ctx.translate(W/2-camX, H/2-camY);

  // Ground!
  ctx.fillStyle="#3a7d44"; ctx.fillRect(camX-1000,camY-1000,2000,2000);
  // Road - vertical!
  ctx.fillStyle="#232323"; ctx.fillRect(-18,camY-1000,36,2000);
  ctx.fillStyle="#fff";
  for(let y=Math.floor((camY-1000)/60)*60; y<camY+1000; y+=60){ ctx.fillRect(-2,y,4,28); }
  // Footpath!
  ctx.fillStyle="#9ca3af"; ctx.fillRect(-28,camY-1000,10,2000); ctx.fillRect(18,camY-1000,10,2000);
  // Airport runway!
  ctx.fillStyle="#1f2937"; ctx.fillRect(400,-750,120,400);
  ctx.fillStyle="#fff"; ctx.fillRect(455,-750,6,400);

  // Buildings!
  for(let b of buildings){
    ctx.fillStyle="rgba(0,0,0,.2)"; ctx.fillRect(b.x+6,b.y+6,b.w,b.h);
    ctx.fillStyle=b.c; ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle="rgba(0,0,0,.15)"; ctx.fillRect(b.x,b.y,b.w,8);
    // Windows!
    ctx.fillStyle="#1e293b";
    for(let wx=b.x+8; wx<b.x+b.w-10; wx+=16){ for(let wy=b.y+14; wy<b.y+b.h-10; wy+=16){ ctx.fillStyle=Math.random()>0.85?"#fde68a":"#1e293b"; ctx.fillRect(wx,wy,10,10); } }
  }
  // Shops!
  for(let s of shops){
    let col=s.type==="gun"?"#ef4444":s.type==="bar"?"#ff00ff":s.type==="restaurant"?"#f97316":s.type==="mobile"?"#3b82f6":"#7c3aed";
    ctx.fillStyle=col; ctx.fillRect(s.x-50,s.y-30,100,60);
    ctx.fillStyle="#fff"; ctx.fillRect(s.x-45,s.y-25,90,40);
    ctx.fillStyle="#111"; ctx.font="bold 11px Arial"; ctx.textAlign="center"; ctx.fillText(s.title,s.x,s.y+4);
    ctx.fillStyle="#facc15"; ctx.beginPath(); ctx.arc(s.x,s.y-45,6,0,Math.PI*2); ctx.fill();
  }
  // Police station!
  ctx.fillStyle="#1e40af"; ctx.fillRect(-450,250,110,70);
  ctx.fillStyle="#fff"; ctx.fillRect(-450,280,110,12);
  ctx.fillStyle="#111"; ctx.font="bold 12px Arial"; ctx.fillText("🏛️ POLICE",-395,290);

  // Planes - 747!
  for(let p of planes){
    let isCurrent=(mode==="plane" && Math.hypot(player.x-p.x,player.y-p.y)<90);
    if(isCurrent){ draw747(player.x,player.y,player.angle,1.1,planeAlt); }
    else { draw747(p.x,p.y,p.angle,1,0); }
  }
  // Traffic cars!
  for(let c of cars) drawCar(c.x,c.y,c.angle,c.color,0.9);
  // Police!
  for(let p of police){ if(p.active){ drawCar(p.x,p.y,Math.atan2(player.y-p.y,player.x-p.x),"#ffffff",1); ctx.fillStyle="#3b82f6"; ctx.fillRect(p.x-8,p.y-8,16,6); } }
  // NPCs!
  for(let n of npcs) drawNPC(n.x,n.y,n.angle,n.color);

  // Player!
  if(mode==="plane"){
    // Already drawn as plane!
  } else if(onFoot){
    // Player man!
    ctx.save(); ctx.translate(player.x,player.y); ctx.rotate(player.angle+Math.PI/2);
    ctx.fillStyle="rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(0,0,10,12,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#1e40af"; ctx.fillRect(-7,-9,14,18);
    ctx.fillStyle="#fbbf24"; ctx.beginPath(); ctx.arc(0,-13,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#1e40af"; ctx.fillRect(-7,-20,14,6);
    ctx.fillStyle="#111"; ctx.fillRect(-5,9,4,8); ctx.fillRect(1,9,4,8);
    ctx.restore();
  } else {
    drawCar(player.x,player.y,player.angle,"#1e40af",1.15);
  }

  ctx.restore();

  // HUD - Plane info!
  if(mode==="plane"){
    ctx.fillStyle="rgba(0,0,0,.7)"; ctx.fillRect(W/2-110,H-90,220,36);
    ctx.fillStyle="#ffcc00"; ctx.font="bold 14px Arial"; ctx.textAlign="center";
    ctx.fillText(`✈️ 747 • Alt: ${Math.floor(planeAlt)}m • ${Math.floor(planeThrottle)} KM/H`,W/2,H-68);
  } else if(onFoot){
    ctx.fillStyle="rgba(0,0,0,.7)"; ctx.fillRect(W/2-100,H-90,200,36);
    ctx.fillStyle="#fff"; ctx.font="bold 13px Arial"; ctx.textAlign="center";
    ctx.fillText("🚶 PAIDAL — Shop / 747 ke paas jao + E dabao!",W/2,H-68);
  }

  // Minimap!
  ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(W-110,60,100,100);
  ctx.fillStyle="#22c55e"; ctx.beginPath(); ctx.arc(W-60,110,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#ffcc00"; ctx.fillRect(W-20,20,8,8);
  ctx.fillStyle="#fff"; ctx.font="10px Arial"; ctx.fillText("MAP",W-60,175);

  updateHUD();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
