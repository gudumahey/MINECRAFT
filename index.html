<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GUDU RACING</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#101010;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

canvas{
    display:block;
}

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,#202020,#050505);
    text-align:center;
}

#menu h1{
    font-size:clamp(45px,10vw,100px);
    letter-spacing:8px;
    margin-bottom:10px;
}

#menu h1 span{
    color:#ff3131;
}

#menu p{
    color:#aaa;
    margin-bottom:35px;
}

#start{
    border:0;
    padding:16px 42px;
    border-radius:12px;
    background:white;
    color:#050505;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#start:hover{
    transform:scale(1.05);
}

#hud{
    display:none;
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

#top{
    position:absolute;
    top:20px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
}

.box{
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;
    padding:12px 16px;
    backdrop-filter:blur(8px);
}

#speed{
    font-size:25px;
    font-weight:bold;
}

#speed small{
    font-size:12px;
    color:#aaa;
}

#nitroBar{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    width:min(350px,70vw);
    height:13px;
    border:1px solid rgba(255,255,255,.4);
    border-radius:20px;
    overflow:hidden;
    background:#111;
}

#nitroFill{
    height:100%;
    width:100%;
    background:#22d3ee;
}

#nitroText{
    position:absolute;
    bottom:48px;
    width:100%;
    text-align:center;
    font-size:12px;
    letter-spacing:2px;
}

#mobile{
    display:none;
    position:fixed;
    inset:0;
    z-index:15;
    pointer-events:none;
}

.control{
    position:absolute;
    pointer-events:auto;
    width:65px;
    height:65px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(0,0,0,.5);
    color:white;
    font-size:25px;
}

#left{
    bottom:30px;
    left:25px;
}

#right{
    bottom:30px;
    left:105px;
}

#nitro{
    bottom:30px;
    right:25px;
    width:80px;
    height:80px;
    font-size:14px;
}

@media(max-width:800px){
    #mobile{
        display:block;
    }
}
</style>
</head>

<body>

<div id="menu">

    <h1>
        GUDU<span> RACING</span>
    </h1>

    <p>
        Speed. Drift. Dominate.
    </p>

    <button id="start">
        START RACE
    </button>

</div>


<div id="hud">

    <div id="top">

        <div class="box">
            LAP <b id="lap">1</b> / 3
        </div>

        <div class="box">
            POSITION <b id="position">1</b> / 4
        </div>

        <div class="box" id="speed">
            0 <small>KM/H</small>
        </div>

    </div>


    <div id="nitroText">
        NITRO
    </div>

    <div id="nitroBar">
        <div id="nitroFill"></div>
    </div>

</div>


<div id="mobile">

    <button class="control" id="left">
        ◀
    </button>

    <button class="control" id="right">
        ▶
    </button>

    <button class="control" id="nitro">
        NITRO
    </button>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================
   SCENE
========================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x87ceeb);

scene.fog =
    new THREE.Fog(
        0x87ceeb,
        80,
        500
    );


/* =========================
   CAMERA
========================= */

const camera =
    new THREE.PerspectiveCamera(
        65,
        innerWidth/innerHeight,
        .1,
        1000
    );

camera.position.set(
    0,
    5,
    10
);


/* =========================
   RENDERER
========================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
    renderer.domElement
);


/* =========================
   LIGHT
========================= */

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    50,
    100,
    50
);

sun.castShadow=true;

scene.add(sun);

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        1
    )
);


/* =========================
   MATERIALS
========================= */

const roadMat =
    new THREE.MeshStandardMaterial({
        color:0x242424
    });

const grassMat =
    new THREE.MeshStandardMaterial({
        color:0x246b35
    });

const lineMat =
    new THREE.MeshStandardMaterial({
        color:0xffffff
    });

const redMat =
    new THREE.MeshStandardMaterial({
        color:0xd71920
    });


/* =========================
   GROUND
========================= */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            1000,
            1000
        ),
        grassMat
    );

ground.rotation.x=
    -Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =========================
   TRACK
========================= */

const trackWidth=18;
const trackLength=800;

const road =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            trackWidth,
            trackLength
        ),
        roadMat
    );

road.rotation.x=
    -Math.PI/2;

road.position.z=
    -trackLength/2;

road.position.y=.02;

scene.add(road);


/* =========================
   ROAD LINES
========================= */

for(
    let z=0;
    z>-trackLength;
    z-=10
){

    const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .35,
                .05,
                5
            ),
            lineMat
        );

    line.position.set(
        0,
        .07,
        z
    );

    scene.add(line);

}


/* =========================
   SIDE MARKERS
========================= */

for(
    let z=0;
    z>-trackLength;
    z-=12
){

    for(
        const x of [-10,10]
    ){

        const marker =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1,
                    .6,
                    3
                ),
                redMat
            );

        marker.position.set(
            x,
            .3,
            z
        );

        scene.add(marker);

    }

}


/* =========================
   TREES
========================= */

function tree(x,z){

    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .35,
                .45,
                3
            ),
            new THREE.MeshStandardMaterial({
                color:0x704214
            })
        );

    trunk.position.set(
        x,
        1.5,
        z
    );

    scene.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.7,
                8,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x15803d
            })
        );

    leaves.position.set(
        x,
        3.5,
        z
    );

    scene.add(leaves);

}


for(
    let i=0;
    i<120;
    i++
){

    const z=
        -Math.random()*trackLength;

    const side=
        Math.random()<.5
        ? -1
        : 1;

    const x=
        side*(15+Math.random()*25);

    tree(x,z);

}


/* =========================
   CAR FUNCTION
========================= */

function createCar(color){

    const car =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.3,
                .65,
                4
            ),
            new THREE.MeshStandardMaterial({
                color:color,
                metalness:.5,
                roughness:.25
            })
        );

    body.position.y=.65;

    body.castShadow=true;

    car.add(body);


    const cabin =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.65,
                .6,
                1.7
            ),
            new THREE.MeshStandardMaterial({
                color:0x111827,
                metalness:.4,
                roughness:.15
            })
        );

    cabin.position.set(
        0,
        1.05,
        -.15
    );

    cabin.castShadow=true;

    car.add(cabin);


    const wheelMat =
        new THREE.MeshStandardMaterial({
            color:0x050505
        });


    for(
        const x of [-1.15,1.15]
    ){

        for(
            const z of [-1.35,1.35]
        ){

            const wheel =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .43,
                        .43,
                        .28,
                        16
                    ),
                    wheelMat
                );

            wheel.rotation.z=
                Math.PI/2;

            wheel.position.set(
                x,
                .45,
                z
            );

            car.add(wheel);

        }

    }

    return car;

}


/* =========================
   PLAYER
========================= */

const player =
    createCar(0x7c3aed);

player.position.set(
    0,
    0,
    -5
);

scene.add(player);


/* =========================
   AI
========================= */

const aiCars=[];

const aiColors=[
    0xe11d48,
    0xf59e0b,
    0x06b6d4
];

aiColors.forEach(
    (color,i)=>{

        const car=
            createCar(color);

        car.position.set(
            (i-1)*5,
            0,
            -15-i*8
        );

        scene.add(car);

        aiCars.push({
            mesh:car,
            speed:0.9+
                Math.random()*.25
        });

    }
);


/* =========================
   GAME STATE
========================= */

let running=false;

let speed=0;

let nitro=100;

let distance=0;

let lap=1;

let keys={};

let playerX=0;


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=true;

    }
);

document.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;

    }
);


/* =========================
   MOBILE CONTROLS
========================= */

function holdButton(
    element,
    key
){

    element.addEventListener(
        "touchstart",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );

    element.addEventListener(
        "touchend",
        e=>{
            e.preventDefault();
            keys[key]=false;
        }
    );

}

holdButton(
    document.getElementById("left"),
    "a"
);

holdButton(
    document.getElementById("right"),
    "d"
);

holdButton(
    document.getElementById("nitro"),
    "shift"
);


/* =========================
   START
========================= */

document.getElementById(
    "start"
).onclick=()=>{

    running=true;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "hud"
    ).style.display="block";

};


/* =========================
   GAME LOOP
========================= */

const clock=
    new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );


    if(running){

        /* ACCELERATION */

        if(
            keys.w ||
            keys.arrowup
        ){

            speed+=
                22*delta;

        }else{

            speed-=
                10*delta;

        }


        /* BRAKE */

        if(
            keys.s ||
            keys.arrowdown
        ){

            speed-=
                28*delta;

        }


        /* LIMIT */

        speed=
            Math.max(
                0,
                Math.min(
                    speed,
                    120
                )
            );


        /* NITRO */

        if(
            keys.shift &&
            nitro>0 &&
            speed>10
        ){

            speed+=
                70*delta;

            nitro-=
                35*delta;

        }else{

            nitro+=
                8*delta;

        }

        nitro=
            Math.max(
                0,
                Math.min(
                    100,
                    nitro
                )
            );


        /* STEERING */

        if(
            keys.a ||
            keys.arrowleft
        ){

            playerX-=
                9*delta;

        }

        if(
            keys.d ||
            keys.arrowright
        ){

            playerX+=
                9*delta;

        }


        playerX=
            Math.max(
                -7,
                Math.min(
                    7,
                    playerX
                )
            );


        player.position.x=
            playerX;


        /* WORLD MOVEMENT */

        const movement=
            speed*delta*.08;

        distance+=movement;


        player.position.z=
            -5;


        /* AI */

        aiCars.forEach(
            ai=>{

                ai.mesh.position.z+=
                    ai.speed*
                    movement*
                    1.4;

                if(
                    ai.mesh.position.z>
                    15
                ){

                    ai.mesh.position.z=
                        -trackLength;

                }

            }
        );


        /* LAP */

        if(
            distance>
            trackLength
        ){

            distance=0;

            lap++;

            if(lap>3){

                lap=3;

                alert(
                    "🏁 FINISH!\n\n"+
                    "Great race!"
                );

                running=false;

                document.getElementById(
                    "menu"
                ).style.display="flex";

            }

        }


        /* CAMERA */

        camera.position.x=
            THREE.MathUtils.lerp(
                camera.position.x,
                player.position.x,
                .08
            );

        camera.position.z=
            THREE.MathUtils.lerp(
                camera.position.z,
                player.position.z+10,
                .08
            );

        camera.position.y=
            THREE.MathUtils.lerp(
                camera.position.y,
                5,
                .08
            );

        camera.lookAt(
            player.position.x,
            .7,
            player.position.z-10
        );


        /* HUD */

        document.getElementById(
            "speed"
        ).innerHTML=
            Math.floor(speed)+
            ' <small>KM/H</small>';

        document.getElementById(
            "lap"
        ).textContent=lap;

        document.getElementById(
            "nitroFill"
        ).style.width=
            nitro+"%";


        /* POSITION */

        let position=1;

        aiCars.forEach(
            ai=>{

                if(
                    ai.mesh.position.z>
                    player.position.z
                ){

                    position++;

                }

            }
        );

        document.getElementById(
            "position"
        ).textContent=
            position;

    }


    renderer.render(
        scene,
        camera
    );

}

animate();


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
