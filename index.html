<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GUDU RACING</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
    color:white;
}

canvas{
    display:block;
}

#menu{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at center,#252525,#030303);
    text-align:center;
}

#menu h1{
    font-size:clamp(45px,11vw,100px);
    letter-spacing:7px;
}

#menu h1 span{
    color:#ef4444;
}

#menu p{
    color:#aaa;
    margin:15px 0 35px;
}

#start{
    padding:16px 45px;
    border:0;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#hud{
    display:none;
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

#top{
    position:absolute;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.hudbox{
    padding:11px 15px;
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;
    backdrop-filter:blur(8px);
}

#speed{
    font-size:24px;
    font-weight:bold;
}

#speed small{
    font-size:10px;
    color:#aaa;
}

#nitroBox{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    width:260px;
}

#nitroText{
    text-align:center;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:5px;
}

#nitroBar{
    height:11px;
    background:#111;
    border:1px solid #555;
    border-radius:20px;
    overflow:hidden;
}

#nitroFill{
    height:100%;
    width:100%;
    background:#22d3ee;
}

#steering{
    display:none;
    position:fixed;
    bottom:25px;
    left:25px;
    width:125px;
    height:125px;
    border-radius:50%;
    border:12px solid rgba(255,255,255,.75);
    background:rgba(0,0,0,.35);
    z-index:20;
    box-shadow:
        0 0 0 5px rgba(0,0,0,.3),
        0 10px 30px rgba(0,0,0,.4);
    touch-action:none;
}

#steering::before,
#steering::after{
    content:"";
    position:absolute;
    background:rgba(255,255,255,.75);
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

#steering::before{
    width:9px;
    height:90px;
}

#steering::after{
    width:90px;
    height:9px;
}

#steerCenter{
    position:absolute;
    width:34px;
    height:34px;
    border-radius:50%;
    background:#111;
    border:5px solid #ddd;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:2;
}

#pedals{
    display:none;
    position:fixed;
    bottom:25px;
    right:20px;
    z-index:20;
    gap:12px;
}

.pedal{
    width:75px;
    height:75px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(0,0,0,.55);
    color:white;
    font-weight:bold;
    touch-action:none;
}

#gas{
    background:rgba(20,150,70,.55);
}

#brake{
    background:rgba(180,30,30,.55);
}

@media(max-width:800px){

    #steering,
    #pedals{
        display:flex;
    }

    #top{
        font-size:12px;
    }

    .hudbox{
        padding:8px 10px;
    }

    #nitroBox{
        bottom:165px;
        width:190px;
    }
}
</style>
</head>

<body>

<div id="menu">

    <h1>
        GUDU<span> RACING</span>
    </h1>

    <p>
        DRIVE • DRIFT • DOMINATE
    </p>

    <button id="start">
        START RACE
    </button>

</div>

<div id="hud">

    <div id="top">

        <div class="hudbox">
            LAP <b id="lap">1</b> / 3
        </div>

        <div class="hudbox">
            POS <b id="position">1</b> / 4
        </div>

        <div class="hudbox" id="speed">
            0 <small>KM/H</small>
        </div>

    </div>

    <div id="nitroBox">

        <div id="nitroText">
            NITRO
        </div>

        <div id="nitroBar">
            <div id="nitroFill"></div>
        </div>

    </div>

</div>

<!-- MOBILE STEERING -->

<div id="steering">
    <div id="steerCenter"></div>
</div>

<div id="pedals">

    <button class="pedal" id="brake">
        BRAKE
    </button>

    <button class="pedal" id="gas">
        GAS
    </button>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =================================
   SCENE
================================= */

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x86c9ef);

scene.fog =
new THREE.Fog(
    0x86c9ef,
    80,
    500
);


/* =================================
   CAMERA
================================= */

const camera =
new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    .1,
    1200
);

camera.position.set(
    0,
    5,
    10
);


/* =================================
   RENDERER
================================= */

const renderer =
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =================================
   LIGHT
================================= */

const sun =
new THREE.DirectionalLight(
    0xffffff,
    2.5
);

sun.position.set(
    80,
    120,
    50
);

sun.castShadow=true;

scene.add(sun);

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x385b30,
        1.1
    )
);


/* =================================
   MATERIALS
================================= */

const roadMaterial =
new THREE.MeshStandardMaterial({
    color:0x242424,
    roughness:.95
});

const grassMaterial =
new THREE.MeshStandardMaterial({
    color:0x28733a
});

const whiteMaterial =
new THREE.MeshStandardMaterial({
    color:0xffffff
});

const redMaterial =
new THREE.MeshStandardMaterial({
    color:0xd71920
});


/* =================================
   GROUND
================================= */

const ground =
new THREE.Mesh(
    new THREE.PlaneGeometry(
        1200,
        1200
    ),
    grassMaterial
);

ground.rotation.x=-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =================================
   ROAD
================================= */

const roadLength=1500;

const road =
new THREE.Mesh(
    new THREE.PlaneGeometry(
        20,
        roadLength
    ),
    roadMaterial
);

road.rotation.x=-Math.PI/2;

road.position.y=.02;

road.position.z=
-roadLength/2;

road.receiveShadow=true;

scene.add(road);


/* =================================
   ROAD CENTER LINES
================================= */

for(
    let z=5;
    z>-roadLength;
    z-=12
){

    const line =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            .35,
            .06,
            6
        ),
        whiteMaterial
    );

    line.position.set(
        0,
        .07,
        z
    );

    scene.add(line);
}


/* =================================
   ROAD SIDES
================================= */

for(
    let z=0;
    z>-roadLength;
    z-=10
){

    for(
        const x of [-11,11]
    ){

        const marker =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1,
                .5,
                3
            ),
            redMaterial
        );

        marker.position.set(
            x,
            .25,
            z
        );

        marker.castShadow=true;

        scene.add(marker);

    }
}


/* =================================
   TREE
================================= */

function makeTree(x,z){

    const trunk =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .3,
            .42,
            3,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0x704214
        })
    );

    trunk.position.set(
        x,
        1.5,
        z
    );

    trunk.castShadow=true;

    scene.add(trunk);


    const crown =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            1.7,
            10,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0x176b35
        })
    );

    crown.position.set(
        x,
        3.5,
        z
    );

    crown.castShadow=true;

    scene.add(crown);
}


for(
    let i=0;
    i<150;
    i++
){

    const side=
        Math.random()<.5 ? -1 : 1;

    const x=
        side*(16+Math.random()*35);

    const z=
        -Math.random()*roadLength;

    makeTree(x,z);
}


/* =================================
   SPORTS CAR
================================= */

function createCar(color){

    const car =
    new THREE.Group();


    const paint =
    new THREE.MeshStandardMaterial({
        color:color,
        metalness:.7,
        roughness:.22
    });


    const black =
    new THREE.MeshStandardMaterial({
        color:0x080808,
        metalness:.3,
        roughness:.2
    });


    const glass =
    new THREE.MeshStandardMaterial({
        color:0x10243a,
        metalness:.2,
        roughness:.08,
        transparent:true,
        opacity:.85
    });


    /* LOWER BODY */

    const body =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            2.4,
            .48,
            4.5
        ),
        paint
    );

    body.position.y=.62;

    body.castShadow=true;

    car.add(body);


    /* HOOD */

    const hood =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            2.2,
            .25,
            1.35
        ),
        paint
    );

    hood.position.set(
        0,
        .82,
        -1.55
    );

    hood.rotation.x=.03;

    car.add(hood);


    /* ROOF */

    const roof =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.65,
            .55,
            1.75
        ),
        paint
    );

    roof.position.set(
        0,
        1.13,
        .05
    );

    roof.rotation.x=-.05;

    roof.castShadow=true;

    car.add(roof);


    /* WINDSHIELD */

    const windshield =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.48,
            .43,
            .05
        ),
        glass
    );

    windshield.position.set(
        0,
        1.18,
        -.86
    );

    windshield.rotation.x=
        Math.PI/2.7;

    car.add(windshield);


    /* REAR GLASS */

    const rearGlass =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.48,
            .4,
            .05
        ),
        glass
    );

    rearGlass.position.set(
        0,
        1.17,
        .92
    );

    rearGlass.rotation.x=
        -Math.PI/2.7;

    car.add(rearGlass);


    /* SIDE SKIRTS */

    for(
        const x of [-1.25,1.25]
    ){

        const skirt =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .12,
                .35,
                3.5
            ),
            black
        );

        skirt.position.set(
            x,
            .48,
            .1
        );

        car.add(skirt);

    }


    /* SPOILER */

    const spoiler =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            2.5,
            .12,
            .35
        ),
        black
    );

    spoiler.position.set(
        0,
        1.18,
        2.05
    );

    car.add(spoiler);


    /* SPOILER POSTS */

    for(
        const x of [-.75,.75]
    ){

        const post =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .08,
                .45,
                .08
            ),
            black
        );

        post.position.set(
            x,
            .95,
            2
        );

        car.add(post);

    }


    /* WHEELS */

    const wheelMaterial =
    new THREE.MeshStandardMaterial({
        color:0x050505,
        roughness:.5
    });


    for(
        const x of [-1.28,1.28]
    ){

        for(
            const z of [-1.45,1.45]
        ){

            const wheel =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .48,
                    .48,
                    .3,
                    20
                ),
                wheelMaterial
            );

            wheel.rotation.z=
                Math.PI/2;

            wheel.position.set(
                x,
                .48,
                z
            );

            wheel.castShadow=true;

            car.add(wheel);


            const rim =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .23,
                    .23,
                    .32,
                    16
                ),
                new THREE.MeshStandardMaterial({
                    color:0xaaaaaa,
                    metalness:.8,
                    roughness:.25
                })
            );

            rim.rotation.z=
                Math.PI/2;

            rim.position.set(
                x,
                .48,
                z
            );

            car.add(rim);

        }
    }


    /* HEADLIGHTS */

    const lightMaterial =
    new THREE.MeshStandardMaterial({
        color:0xffffff,
        emissive:0xffffff,
        emissiveIntensity:2
    });


    for(
        const x of [-.72,.72]
    ){

        const light =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .42,
                .12,
                .08
            ),
            lightMaterial
        );

        light.position.set(
            x,
            .76,
            -2.28
        );

        car.add(light);

    }


    return car;
}


/* =================================
   PLAYER
================================= */

const player =
createCar(0x7c3aed);

player.position.set(
    0,
    0,
    0
);

scene.add(player);


/* =================================
   AI CARS
================================= */

const aiCars=[];

const colors=[
    0xe11d48,
    0xf59e0b,
    0x06b6d4
];

colors.forEach(
    (color,i)=>{

        const car =
        createCar(color);

        car.position.set(
            (i-1)*5,
            0,
            -25-i*15
        );

        scene.add(car);

        aiCars.push({
            mesh:car,
            speed:
                28+
                Math.random()*12
        });

    }
);


/* =================================
   GAME VARIABLES
================================= */

let gameStarted=false;

let speed=0;

let maxSpeed=115;

let nitro=100;

let playerX=0;

let distance=0;

let lap=1;

let steering=0;

let gas=false;

let brake=false;

let nitroPressed=false;


/* =================================
   KEYBOARD
================================= */

const keys={};

document.addEventListener(
    "keydown",
    e=>{
        keys[
            e.key.toLowerCase()
        ]=true;
    }
);

document.addEventListener(
    "keyup",
    e=>{
        keys[
            e.key.toLowerCase()
        ]=false;
    }
);


/* =================================
   MOBILE STEERING
================================= */

const wheel=
document.getElementById("steering");

let steeringTouch=false;

wheel.addEventListener(
    "touchstart",
    e=>{
        steeringTouch=true;
        e.preventDefault();
    },
    {passive:false}
);

wheel.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();

        if(!steeringTouch)return;

        const rect=
            wheel.getBoundingClientRect();

        const x=
            e.touches[0].clientX-
            (rect.left+rect.width/2);

        steering=
            THREE.MathUtils.clamp(
                x/(rect.width/2),
                -1,
                1
            );

    },
    {passive:false}
);

wheel.addEventListener(
    "touchend",
    ()=>{
        steeringTouch=false;
        steering=0;
    }
);


/* =================================
   PEDALS
================================= */

function touchButton(
    element,
    callback
){

    element.addEventListener(
        "touchstart",
        e=>{
            e.preventDefault();
            callback(true);
        },
        {passive:false}
    );

    element.addEventListener(
        "touchend",
        e=>{
            e.preventDefault();
            callback(false);
        },
        {passive:false}
    );

}

touchButton(
    document.getElementById("gas"),
    value=>gas=value
);

touchButton(
    document.getElementById("brake"),
    value=>brake=value
);


/* =================================
   START
================================= */

document.getElementById(
    "start"
).onclick=()=>{

    gameStarted=true;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "hud"
    ).style.display="block";

};


/* =================================
   RESET
================================= */

function resetGame(){

    speed=0;

    nitro=100;

    playerX=0;

    distance=0;

    lap=1;

    player.position.set(
        0,
        0,
        0
    );

    aiCars.forEach(
        (ai,i)=>{

            ai.mesh.position.set(
                (i-1)*5,
                0,
                -25-i*15
            );

        }
    );

}


/* =================================
   GAME LOOP
================================= */

const clock=
new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta=
        Math.min(
            clock.getDelta(),
            .05
        );


    if(gameStarted){

        /* GAS */

        const accelerating =
            keys.w ||
            keys.arrowup ||
            gas;


        const braking =
            keys.s ||
            keys.arrowdown ||
            brake;


        if(accelerating){

            speed +=
                48*delta;

        }else{

            speed -=
                12*delta;

        }


        if(braking){

            speed -=
                70*delta;

        }


        /* NITRO */

        nitroPressed =
            keys.shift;

        if(
            nitroPressed &&
            nitro>0 &&
            speed>20
        ){

            speed +=
                95*delta;

            nitro -=
                35*delta;

        }else{

            nitro +=
                7*delta;

        }


        nitro=
            THREE.MathUtils.clamp(
                nitro,
                0,
                100
            );


        speed=
            THREE.MathUtils.clamp(
                speed,
                0,
                maxSpeed
            );


        /* STEERING */

        let steerInput=steering;

        if(
            keys.a ||
            keys.arrowleft
        ){

            steerInput=-1;

        }

        if(
            keys.d ||
            keys.arrowright
        ){

            steerInput=1;

        }


        playerX +=
            steerInput*
            (7+
            speed*.035)*
            delta;


        playerX=
            THREE.MathUtils.clamp(
                playerX,
                -7.5,
                7.5
            );


        /* REAL FORWARD MOVEMENT */

        const movement=
            speed*
            delta*
            .055;

        player.position.z -=
            movement;

        player.position.x=
            THREE.MathUtils.lerp(
                player.position.x,
                playerX,
                .25
            );


        /* CAR BODY LEAN */

        player.rotation.z=
            THREE.MathUtils.lerp(
                player.rotation.z,
                -steerInput*.08,
                .15
            );


        /* DISTANCE */

        distance += movement;


        /* AI MOVEMENT */

        aiCars.forEach(
            ai=>{

                ai.mesh.position.z -=
                    ai.speed*
                    delta*
                    .055;

                if(
                    ai.mesh.position.z <
                    player.position.z-120
                ){

                    ai.mesh.position.z=
                        player.position.z+
                        250+
                        Math.random()*100;

                    ai.mesh.position.x=
                        (Math.random()*14)-7;

                }

            }
        );


        /* LAP */

        if(
            distance>=500
        ){

            distance=0;

            lap++;

            if(lap>3){

                gameStarted=false;

                alert(
                    "🏁 RACE FINISHED!\n\n"+
                    "GUDU RACING"
                );

                resetGame();

                document.getElementById(
                    "menu"
                ).style.display="flex";

                document.getElementById(
                    "hud"
                ).style.display="none";

            }

        }


        /* CAMERA FOLLOWS CAR */

        const targetCameraX=
            player.position.x;

        camera.position.x=
            THREE.MathUtils.lerp(
                camera.position.x,
                targetCameraX,
                .08
            );

        camera.position.z=
            THREE.MathUtils.lerp(
                camera.position.z,
                player.position.z+11,
                .10
            );

        camera.position.y=
            THREE.MathUtils.lerp(
                camera.position.y,
                5.2,
                .08
            );


        camera.lookAt(
            player.position.x,
            .7,
            player.position.z-18
        );


        /* HUD */

        document.getElementById(
            "speed"
        ).innerHTML=
            Math.floor(speed)+
            ' <small>KM/H</small>';


        document.getElementById(
            "lap"
        ).textContent=lap;


        document.getElementById(
            "nitroFill"
        ).style.width=
            nitro+"%";


        /* POSITION */

        let position=1;

        aiCars.forEach(
            ai=>{

                if(
                    ai.mesh.position.z >
                    player.position.z
                ){

                    position++;

                }

            }
        );

        document.getElementById(
            "position"
        ).textContent=
            position;

    }


    renderer.render(
        scene,
        camera
    );

}

animate();


/* =================================
   RESIZE
================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
